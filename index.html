<style>
:root{
  --navy:#0f172a;--navy2:#182338;--ink:#172033;--muted:#667085;--line:#e5e9ef;
  --bg:#f4f6f8;--card:#fff;--accent:#b7838e;--accent2:#f3e8eb;--green:#157347;
  --orange:#b05c18;--red:#b42318;--blue:#175cd3;--shadow:0 8px 26px rgba(15,23,42,.09);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh}
.topbar{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:max(16px,env(safe-area-inset-top)) 18px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.topbar:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:rgba(183,131,142,.19)}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:11px}
.logo{width:43px;height:43px;border-radius:13px;background:#fff;color:var(--navy);font-weight:950;display:flex;align-items:center;justify-content:center;letter-spacing:-.08em}
.brand-main{font-size:16px;font-weight:950;letter-spacing:.04em}.brand-sub{font-size:10.5px;opacity:.66;margin-top:2px}
.network{margin-left:auto;font-size:9px;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:4px 8px;opacity:.85}
.headline{position:relative;z-index:1;margin-top:23px}.headline h1{font-size:24px;margin:0;font-weight:950;letter-spacing:-.03em}.headline p{font-size:12px;opacity:.68;margin:5px 0 0}
.content{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero-card{border:0;background:linear-gradient(135deg,#fff,#faf5f6)}
.section-title{font-size:13px;font-weight:950;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between}
.sub{font-size:11px;color:var(--muted);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.kpi b{font-size:20px;display:block}.kpi span{font-size:9.5px;color:var(--muted)}
.primary{border:0;background:var(--navy);color:#fff;font-weight:900;border-radius:14px;padding:13px 15px}.primary:disabled{opacity:.5}
.light{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850;border-radius:14px;padding:12px 14px}
.danger{border:1px solid #f3c7c2;background:#fff;color:var(--red);font-weight:850;border-radius:12px;padding:10px 12px}
.big-action{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px;margin-bottom:9px}.big-action .ico{width:43px;height:43px;border-radius:13px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:20px}.big-action b{display:block;font-size:13px}.big-action small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.chev{margin-left:auto;color:#98a2b3;font-size:19px}
.job{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin-bottom:9px}.job-top{display:flex;gap:10px;align-items:flex-start}.job-main{flex:1;min-width:0}.job-title{font-size:13px;font-weight:950}.job-place{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.job-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:8.8px;font-weight:850;background:#fafafa}.chip.progress{background:#edf5ff;color:var(--blue);border-color:#bdd5ff}.chip.received{background:#fff4e8;color:var(--orange);border-color:#f2d4b7}.chip.done{background:#eaf7f0;color:var(--green);border-color:#bde4cf}.chip.urgent{background:#fff0ee;color:var(--red);border-color:#f3c7c2}
.job-date{text-align:right;font-size:9.5px;color:var(--muted);white-space:nowrap}
.field{margin-bottom:12px}.field label{display:block;font-size:9.5px;font-weight:900;color:#475467;margin:0 0 5px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dee7;background:#fff;border-radius:12px;padding:11px;color:var(--ink);outline:none}.field textarea{resize:vertical;min-height:84px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9cabbf;box-shadow:0 0 0 3px rgba(15,23,42,.05)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switch{display:flex;background:#edf0f3;border-radius:13px;padding:3px;gap:3px;margin-bottom:14px}.switch button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-size:10.5px;font-weight:850;color:var(--muted)}.switch button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.08)}
.searchbox{position:relative}.results{position:absolute;z-index:10;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:260px;overflow:auto}.result{padding:10px 11px;border-bottom:1px solid #f0f1f3;font-size:10.5px}.result:last-child{border:0}.result b{display:block;font-size:11px}
.detail-head{margin-bottom:12px}.detail-head h2{font-size:19px;margin:0;font-weight:950}.detail-place{font-size:11px;color:var(--muted);margin-top:5px}.request{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:11px;line-height:1.5;white-space:pre-wrap}
.timeline{border-left:2px solid #e4e8ee;margin-left:7px;padding-left:15px}.visit{position:relative;margin:0 0 14px}.visit:before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}.visit h4{font-size:11px;margin:0 0 5px}.visit p{font-size:10px;color:var(--muted);margin:3px 0;white-space:pre-wrap}
.timer{background:var(--navy);color:#fff;border-radius:18px;padding:15px;text-align:center;margin:12px 0}.timer .time{font-variant-numeric:tabular-nums;font-size:31px;font-weight:950;letter-spacing:.03em}.timer small{opacity:.62;font-size:9.5px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo{position:relative;border-radius:12px;overflow:hidden;background:#eef1f4;aspect-ratio:1/1}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo button{position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:50%;border:0;background:rgba(15,23,42,.8);color:#fff}.add-photo{border:1.5px dashed #c7cdd7;border-radius:12px;background:#fafafa;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:9.5px}.add-photo b{font-size:23px;color:var(--accent)}
.check{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid #f0f1f3}.check:last-child{border:0}.check input{width:20px;height:20px;accent-color:var(--navy)}.check span{font-size:11px;font-weight:800;padding-top:2px}
.footer-actions{display:grid;gap:8px;margin-top:14px}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:11px}.empty .ico{font-size:32px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;border-radius:999px;padding:9px 14px;font-size:10.5px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{display:inline-block;width:18px;height:18px;border:2px solid #ddd;border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bottom{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e3e7ed;backdrop-filter:blur(12px)}.bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#8a94a3;font-size:9px;font-weight:850;padding:6px 2px}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.nav.on{color:var(--navy)}
.back{border:0;background:transparent;color:var(--muted);padding:0;font-size:10.5px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:80;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{font-size:16px;margin:0 0 13px}
.auth-wrap{min-height:100vh;background:linear-gradient(150deg,var(--navy),#26344d);padding:max(24px,env(safe-area-inset-top)) 16px 30px;display:flex;align-items:center}.auth-card{max-width:430px;width:100%;margin:auto;background:#fff;border-radius:25px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.auth-logo{width:56px;height:56px;border-radius:17px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950;margin-bottom:18px}.auth-card h1{font-size:23px;margin:0}.users{display:grid;gap:8px;margin-top:16px}.user{display:flex;align-items:center;gap:11px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:left}.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:950}.user b{font-size:12px}.user small{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.pin-dots{display:flex;justify-content:center;gap:9px;margin:20px 0}.dot{width:13px;height:13px;border:2px solid #cbd2dc;border-radius:50%}.dot.on{background:var(--navy);border-color:var(--navy)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{border:0;height:57px;border-radius:14px;background:#f4f6f8;font-size:19px;font-weight:900}.key.alt{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:520px){.content{padding:13px}.two{grid-template-columns:1fr}.photos{grid-template-columns:repeat(3,1fr)}}
</style>

  --navy2:#242f3f;

<body>
<div id="authRoot"></div>
<div id="appRoot" class="hidden">
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo real-logo"><img src="assets/dl-technik-logo.png" alt="DL TECHNIK"></div><div><div class="brand-main">DL TECHNIK</div><div class="brand-sub">INTERVENTIONS TERRAIN · WAPILOT</div></div><div id="network" class="network">EN LIGNE</div></div>
      <div id="headline" class="headline"></div>
    </header>
    <main id="content" class="content"></main>
  </div>
  <nav class="bottom">
    <div class="bottom-inner">
      <button class="nav on" data-view="home" onclick="go('home')"><i>⌂</i>Accueil</button>
      <button class="nav" data-view="jobs" onclick="go('jobs')"><i>☷</i>Interventions</button>
      <button class="nav" data-view="new" onclick="go('new')"><i>＋</i>Nouvelle</button>
      <button class="nav" data-view="done" onclick="go('done')"><i>✓</i>Terminées</button>
    </div>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
const CFG={url:"https://ccboibbhsztcupfcrndx.supabase.co",key:"sb_publishable_Dzt9mbx7jw9qYEEJn7NAdg_zp7DPrJ9",fn:"dl-technik-auth"};
const API=CFG.url+"/functions/v1/"+CFG.fn;
const TOKEN_KEY="dl_technik_device_token_v1";
const storageClient=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);
let me=null,users=[],pin="",pinStep="login",pinFirst="",selectedUser=null;
let state={dashboard:null,jobs:[],done:[],refs:null,current:null,currentDetail:null};


function deviceName(){return `${navigator.platform||"Appareil"} · ${/Mobile|iPhone|Android/i.test(navigator.userAgent)?"Mobile":"Navigateur"}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(v){if(!v)return "—";try{return new Date(String(v).length===10?v+"T12:00:00":v).toLocaleDateString("fr-BE",{day:"2-digit",month:"2-digit",year:"numeric"})}catch{return v}}
function fmtMinutes(n){n=Number(n||0);if(!n)return "—";const h=Math.floor(n/60),m=n%60;return h?`${h} h ${String(m).padStart(2,"0")}`:`${m} min`}
function statusLabel(s){return ({draft:"Brouillon",assigned:"À faire",in_progress:"En cours",report_received:"Rapport envoyé",validated:"Validée",archived:"Archivée",cancelled:"Annulée"})[s]||s}
function statusClass(s){return s==="in_progress"?"progress":s==="report_received"?"received":["validated","archived"].includes(s)?"done":""}
function priorityChip(p){return p==="urgent"?'<span class="chip urgent">URGENT</span>':p==="high"?'<span class="chip urgent">Prioritaire</span>':""}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),2200)}
function loading(){return '<div class="empty"><span class="loader"></span><div style="margin-top:9px">Chargement…</div></div>'}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function setNetwork(){const e=$("network");if(!e)return;e.textContent=navigator.onLine?"EN LIGNE":"HORS LIGNE";e.style.opacity=navigator.onLine?".85":"1";e.style.background=navigator.onLine?"transparent":"#b42318"}
addEventListener("online",setNetwork);addEventListener("offline",setNetwork);

async function api(action,payload={}){
  const token=localStorage.getItem(TOKEN_KEY);
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":CFG.key,"Authorization":"Bearer "+CFG.key},body:JSON.stringify({action,device_name:deviceName(),device_token:token,...payload})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(j.error==="SESSION_INVALID"){localStorage.removeItem(TOKEN_KEY);me=null;showAuth();throw new Error("Session expirée.");}
    throw new Error(j.error||"Erreur de connexion.");
  }
  return j;
}

/* ---------------- AUTH ---------------- */
async function boot(){
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
  const token=localStorage.getItem(TOKEN_KEY);
  if(token){
    try{const r=await api("session");if(r.valid){me=r.technician;showApp();await go("home");return}}catch(e){}
  }
  await showAuth();
}
async function showAuth(){
  $("appRoot").classList.add("hidden");$("authRoot").classList.remove("hidden");
  $("authRoot").innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="auth-logo real-auth-logo"><img src="assets/dl-technik-logo.png" alt="DL TECHNIK"></div><h1>DL TECHNIK</h1><p class="sub">Sélectionnez votre profil pour accéder aux interventions terrain.</p><div id="authUsers" class="users">${loading()}</div></div></div>`;
  try{const r=await api("list_users");users=r.users||[];renderUsers()}catch(e){$("authUsers").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function renderUsers(){
  $("authUsers").innerHTML=users.map(u=>`<button class="user" onclick="chooseUser('${u.id}')"><span class="avatar">${initials(u.display_name)}</span><span><b>${esc(u.display_name)}</b><small>${esc(u.trade||"Équipe terrain")}</small></span><span class="chev">›</span></button>`).join("")||'<div class="empty">Aucun technicien actif.</div>';
}
function chooseUser(id){
  selectedUser=users.find(x=>x.id===id);pin="";pinFirst="";pinStep=selectedUser.pin_configured?"login":"setup1";renderPin();
}
function renderPin(){
  const isLogin=pinStep==="login", isConfirm=pinStep==="setup2";
  const title=isLogin?"Votre code PIN":isConfirm?"Confirmez votre PIN":"Créer votre code PIN";
  const info=isLogin?`Entrez le code à 6 chiffres de ${esc(selectedUser.display_name)}.`:isConfirm?"Retapez exactement les mêmes 6 chiffres.":"Choisissez un code personnel à 6 chiffres.";
  $("authRoot").innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <button class="back" onclick="showAuth()">← Changer de technicien</button>
    <div class="auth-logo real-auth-logo"><img src="assets/dl-technik-logo.png" alt="DL TECHNIK"></div>
    <h1>${title}</h1><p class="sub">${info}</p>
    <input id="nativePin" class="pin-native" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="${isLogin?"current-password":"new-password"}" aria-label="Code PIN">
    <div class="pin-help">Utilisez le clavier numérique de votre téléphone</div>
    <div id="pinMsg" class="sub" style="text-align:center;margin-top:12px"></div>
  </div></div>`;
  setTimeout(()=>{$("nativePin")?.focus();$("nativePin")?.addEventListener("input",e=>{
    e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);
    pin=e.target.value;
    if(pin.length===6)setTimeout(pinSubmit,120);
  })},80);
}
async function pinSubmit(){
  const input=$("nativePin"); if(input) input.disabled=true;
  try{
    if(pinStep==="setup1"){pinFirst=pin;pin="";pinStep="setup2";renderPin();return}
    if(pinStep==="setup2"){
      if(pin!==pinFirst){pin="";pinFirst="";pinStep="setup1";renderPin();throw new Error("Les deux codes ne correspondent pas.");}
      const r=await api("setup_pin",{technician_id:selectedUser.id,pin});localStorage.setItem(TOKEN_KEY,r.device_token);me=r.technician;showApp();await go("home");return;
    }
    const r=await api("login",{technician_id:selectedUser.id,pin});localStorage.setItem(TOKEN_KEY,r.device_token);me=r.technician;showApp();await go("home");
  }catch(e){
    pin="";
    const m=$("pinMsg");if(m){m.textContent=e.message;m.style.color="#b42318"}
    if(input){input.disabled=false;input.value="";input.focus()}
  }
}
function showApp(){$("authRoot").classList.add("hidden");$("appRoot").classList.remove("hidden");setNetwork()}
async function logout(){
  try{await api("logout")}catch(e){}
  localStorage.removeItem(TOKEN_KEY);me=null;state={dashboard:null,jobs:[],done:[],refs:null,current:null,currentDetail:null};await showAuth();
}

/* ---------------- NAV ---------------- */
async function go(view,arg=null){
  document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.view===view || (view==="detail"&&b.dataset.view==="jobs")));
  if(view==="home")return home();
  if(view==="jobs")return jobs(false);
  if(view==="done")return jobs(true);
  if(view==="new")return newJob();
  if(view==="detail")return jobDetail(arg);
}
function setHead(title,sub){$("headline").innerHTML=`<h1>${esc(title)}</h1><p>${esc(sub||"")}</p>`}

/* ---------------- HOME ---------------- */
async function home(){
  setHead("Bonjour "+String(me?.display_name||"").split(" ")[0],"Voici vos interventions DL TECHNIK");
  $("content").innerHTML=loading();
  try{
    const d=await api("dashboard");state.dashboard=d;
    const first=[...(d.in_progress||[]),...(d.assigned||[])][0];
    $("content").innerHTML=`
      ${first?`<div class="card hero-card"><div class="section-title"><span>${d.in_progress?.length?"Intervention en cours":"Prochaine intervention"}</span><span class="chip ${statusClass(first.status)}">${statusLabel(first.status)}</span></div>${jobCard(first,true)}</div>`:""}
      <div class="card"><div class="section-title">Aujourd'hui</div><div class="kpis"><div class="kpi"><b>${d.assigned?.length||0}</b><span>À FAIRE</span></div><div class="kpi"><b>${d.in_progress?.length||0}</b><span>EN COURS</span></div><div class="kpi"><b>${d.completed?.length||0}</b><span>TERMINÉES</span></div></div></div>
      <div class="card"><div class="section-title">Accès rapide</div>
        <button class="big-action" onclick="go('jobs')"><span class="ico">🛠️</span><span><b>Mes interventions</b><small>Rapports à compléter pour les travaux attribués</small></span><span class="chev">›</span></button>
        ${d.technician?.can_create_jobs!==false?`<button class="big-action" onclick="go('new')"><span class="ico">＋</span><span><b>Nouvelle intervention</b><small>Créer et compléter un rapport sur place</small></span><span class="chev">›</span></button>`:""}
        <button class="big-action" onclick="go('done')"><span class="ico">✓</span><span><b>Interventions terminées</b><small>Rapports déjà envoyés à WAPILOT</small></span><span class="chev">›</span></button>
      </div>
      <div style="text-align:center"><button class="back" onclick="logout()">Changer d'utilisateur / se déconnecter</button></div>`;
  }catch(e){$("content").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function jobCard(j,compact=false){
  return `<div class="job" onclick="go('detail','${j.id}')"><div class="job-top"><div class="job-main"><div class="job-title">${esc(j.title||"Intervention")}</div><div class="job-place">${esc(j.location_label||"Lieu non renseigné")}${j.location_address?" · "+esc(j.location_address):""}</div></div><div class="job-date">${fmtDate(j.planned_date||j.created_at)}</div></div><div class="job-meta">${priorityChip(j.priority)}<span class="chip ${statusClass(j.status)}">${statusLabel(j.status)}</span><span class="chip">${esc(j.intervention_type_label||j.intervention_type_code||"")}</span>${!compact?`<span class="chip">⏱ ${fmtMinutes(j.total_minutes)}</span><span class="chip">📷 ${Number(j.photo_count||0)}</span>`:""}</div></div>`;
}

/* ---------------- LISTS ---------------- */
async function jobs(done){
  setHead(done?"Terminées":"Mes interventions",done?"Rapports envoyés et interventions validées":"Interventions qui vous sont attribuées");
  $("content").innerHTML=loading();
  try{
    const r=await api("list_jobs",{mode:done?"completed":"active"});if(done)state.done=r.jobs||[];else state.jobs=r.jobs||[];
    const arr=r.jobs||[];
    $("content").innerHTML=arr.length?`<div>${arr.map(j=>jobCard(j)).join("")}</div>`:`<div class="card empty"><div class="ico">${done?"✓":"🛠️"}</div>${done?"Aucune intervention terminée.":"Aucune intervention à traiter."}</div>`;
  }catch(e){$("content").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

/* ---------------- NEW JOB ---------------- */
async function ensureRefs(){if(!state.refs)state.refs=await api("reference_data");return state.refs}
async function newJob(){
  setHead("Nouvelle intervention","Créer une intervention directement depuis le terrain");
  $("content").innerHTML=loading();
  try{
    const r=await ensureRefs();
    if(!r.can_create_jobs){$("content").innerHTML='<div class="card empty">Votre profil ne permet pas de créer de nouvelles interventions.</div>';return}
    $("content").innerHTML=`<div class="card">
      <div class="switch"><button id="locCoproBtn" class="on" onclick="setLoc('copro')">Copropriété</button><button id="locExtBtn" onclick="setLoc('external')">Autre lieu</button></div>
      <input type="hidden" id="locationType" value="copro"><input type="hidden" id="coproId">
      <div id="coproFields"><div class="field searchbox"><label>RECHERCHER UNE COPROPRIÉTÉ</label><input id="coproSearch" autocomplete="off" placeholder="Tapez le nom…" oninput="searchCopro()"><div id="coproResults" class="results hidden"></div></div><div id="coproSelected" class="sub"></div></div>
      <div id="extFields" class="hidden"><div class="field"><label>NOM DU LIEU / CLIENT</label><input id="extName"></div><div class="field"><label>ADRESSE *</label><input id="extAddress"></div><div class="two"><div class="field"><label>CODE POSTAL</label><input id="extPostal"></div><div class="field"><label>VILLE *</label><input id="extCity"></div></div></div>
      <div class="two"><div class="field"><label>TYPE D'INTERVENTION</label><select id="newType">${r.types.map(t=>`<option value="${esc(t.code)}">${esc(t.label)}</option>`).join("")}</select></div><div class="field"><label>PRIORITÉ</label><select id="newPriority"><option value="normal">Normale</option><option value="high">Prioritaire</option><option value="urgent">Urgente</option><option value="low">Faible</option></select></div></div>
      <div class="field"><label>OBJET *</label><input id="newTitle" placeholder="Ex. Remplacer l'éclairage du hall"></div>
      <div class="field"><label>TRAVAIL À EFFECTUER</label><textarea id="newDesc" placeholder="Décrivez brièvement la demande…"></textarea></div>
      <div class="field"><label>DATE</label><input id="newDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <button id="createBtn" class="primary" style="width:100%" onclick="createJob()">Créer l'intervention</button>
    </div>`;
  }catch(e){$("content").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function setLoc(v){$("locationType").value=v;$("locCoproBtn").classList.toggle("on",v==="copro");$("locExtBtn").classList.toggle("on",v==="external");$("coproFields").classList.toggle("hidden",v!=="copro");$("extFields").classList.toggle("hidden",v!=="external")}
function searchCopro(){
  const q=$("coproSearch").value.trim().toLowerCase(),box=$("coproResults");if(!q){box.classList.add("hidden");return}
  const arr=(state.refs?.copros||[]).filter(c=>`${c.name} ${c.code} ${c.address} ${c.city}`.toLowerCase().includes(q)).slice(0,15);
  box.innerHTML=arr.map(c=>`<div class="result" onclick="selectCopro('${c.id}')"><b>${esc(c.name)}</b><span>${esc([c.address,c.postal_code,c.city].filter(Boolean).join(" "))}</span></div>`).join("")||'<div class="result">Aucun résultat</div>';box.classList.remove("hidden");
}
function selectCopro(id){const c=state.refs.copros.find(x=>x.id===id);if(!c)return;$("coproId").value=id;$("coproSearch").value=c.name;$("coproSelected").textContent=[c.address,c.postal_code,c.city].filter(Boolean).join(" ");$("coproResults").classList.add("hidden")}
async function createJob(){
  const btn=$("createBtn");btn.disabled=true;
  try{
    const loc=$("locationType").value;
    const r=await api("create_job",{location_type:loc,copro_id:$("coproId").value,external_location_name:$("extName")?.value,external_address_line1:$("extAddress")?.value,external_postal_code:$("extPostal")?.value,external_city:$("extCity")?.value,intervention_type_code:$("newType").value,priority:$("newPriority").value,title:$("newTitle").value,description:$("newDesc").value,planned_date:$("newDate").value});
    toast("Intervention créée");
    await api("prepare_visit",{job_id:r.job_id});
    await go("detail",r.job_id);
  }catch(e){alert(e.message)}finally{if(btn)btn.disabled=false}
}

/* ---------------- DETAIL / VISIT ---------------- */
async function jobDetail(id){
  setHead("Intervention","Chargement du rapport terrain…");$("content").innerHTML=loading();
  try{
    const d=await api("job_detail",{job_id:id});state.current=id;state.currentDetail=d;renderDetail();
  }catch(e){$("content").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function currentOpenVisit(){return state.currentDetail?.visits?.find(v=>["draft","in_progress"].includes(v.status))||null}
function latestVisit(){return state.currentDetail?.visits?.[0]||null}
function renderDetail(){
  const d=state.currentDetail,j=d.job,open=currentOpenVisit(),latest=latestVisit();
  setHead(j.title,j.location_label||"Intervention DL TECHNIK");
  const editable=open;
  $("content").innerHTML=`
    <button class="back" onclick="go('jobs')">← Retour aux interventions</button>
    <div class="card"><div class="detail-head"><div class="job-meta" style="margin-top:0">${priorityChip(j.priority)}<span class="chip ${statusClass(j.status)}">${statusLabel(j.status)}</span><span class="chip">${esc(j.intervention_type_label||"")}</span></div><h2>${esc(j.title)}</h2><div class="detail-place">📍 ${esc(j.location_label||"")}${j.location_address?" · "+esc(j.location_address):""}</div></div><div class="section-title">Travail demandé</div><div class="request">${esc(j.description||"Aucune consigne complémentaire.")}</div></div>
    ${open?renderActiveVisit(open,d):renderVisitAction(j,latest)}
    ${d.visits?.length?`<div class="card"><div class="section-title">Historique des passages</div><div class="timeline">${d.visits.map(v=>renderVisitHistory(v)).join("")}</div></div>`:""}
  `;
  if(open){bindCheckChanges()}
}
function renderVisitAction(j,latest){
  if(["validated","archived","cancelled"].includes(j.status))return `<div class="card"><div class="empty"><div class="ico">✓</div>Cette intervention est clôturée dans WAPILOT.</div></div>`;
  const text=j.status==="report_received"?"Ajouter un nouveau passage":"Remplir le rapport";
  const sub=j.status==="report_received"?"Créez un nouveau passage pour poursuivre le chantier.":"Ajoutez les photos et complétez simplement le rapport d’intervention.";
  return `<div class="card"><div class="section-title">Rapport terrain</div><p class="sub">${sub}</p><button class="primary" style="width:100%;margin-top:10px" onclick="prepareVisit()">${text}</button></div>`;
}
function renderActiveVisit(v,d){
  const photos=d.photos||[],before=photos.filter(p=>p.visit_id===v.id&&p.photo_type==="before"),after=photos.filter(p=>p.visit_id===v.id&&p.photo_type==="after");
  const checks=(d.checks||[]).filter(c=>c.visit_id===v.id);
  const total=Number(v.manual_duration_minutes||0),h=Math.floor(total/60),m=total%60;
  return `<div class="card">
    <div class="section-title"><span>Rapport d’intervention</span><span class="chip">À COMPLÉTER</span></div>
    <div class="report-intro">Aucun chronomètre n’est utilisé. Indiquez simplement le temps réellement passé sur place avant d’envoyer votre rapport.</div>
    <div class="section-title">Photos avant <span class="sub">${before.length} photo(s)</span></div>
    ${photoGrid(before,"before",v.id)}
    <div class="field" style="margin-top:14px"><label>TRAVAIL EFFECTUÉ *</label><textarea id="workDone" placeholder="Décrivez précisément ce qui a été réalisé…">${esc(v.work_done||"")}</textarea></div>
    <div class="field"><label>MATÉRIEL UTILISÉ</label><textarea id="materials" placeholder="Ex. 2 ampoules LED, silicone, peinture…">${esc(v.materials_used||"")}</textarea></div>
    ${checks.length?`<div class="section-title">Checklist nettoyage</div><div id="checks">${checks.map(c=>`<label class="check"><input type="checkbox" data-check="${c.id}" ${c.checked?"checked":""}><span>${esc(c.label_snapshot)}</span></label>`).join("")}</div>`:""}
    <div class="section-title" style="margin-top:15px">Photos après <span class="sub">${after.length} photo(s)</span></div>
    ${photoGrid(after,"after",v.id)}
    <div class="field" style="margin-top:14px"><label>TEMPS PASSÉ *</label>
      <div class="time-row">
        <div class="time-unit"><input id="timeHours" type="number" min="0" inputmode="numeric" value="${h||""}" placeholder="0"><span>heures</span></div>
        <div class="time-unit"><input id="timeMinutes" type="number" min="0" max="59" inputmode="numeric" value="${m||""}" placeholder="0"><span>minutes</span></div>
      </div>
    </div>
    <div class="field"><label>REMARQUES</label><textarea id="remarks" placeholder="Difficulté rencontrée, suivi nécessaire…">${esc(v.remarks||"")}</textarea></div>
    <div class="footer-actions"><button class="light" onclick="saveVisit()">Enregistrer sans envoyer</button><button class="primary" onclick="finishVisit()">Envoyer le rapport à WAPILOT</button></div>
  </div>`;
}
function photoGrid(arr,type,visitId){
  return `<div class="photos">${arr.map(p=>`<div class="photo">${p.signed_url?`<img src="${esc(p.signed_url)}" alt="Photo">`:""}<button onclick="event.stopPropagation();deletePhoto('${p.id}')">×</button></div>`).join("")}<button class="add-photo" onclick="pickPhotos('${type}','${visitId}')"><b>＋</b><span>Ajouter</span></button></div>`;
}
function renderVisitHistory(v){
  const mins=v.manual_duration_minutes??v.duration_minutes;
  return `<div class="visit"><h4>${fmtDate(v.visit_date)} · ${v.status==="submitted"?"Rapport envoyé":v.status==="validated"?"Validé":statusLabel(v.status)}</h4><p>⏱ ${fmtMinutes(mins)}</p>${v.work_done?`<p><b>Travaux :</b> ${esc(v.work_done)}</p>`:""}${v.remarks?`<p><b>Remarques :</b> ${esc(v.remarks)}</p>`:""}</div>`;
}
async function prepareVisit(){
  try{await api("prepare_visit",{job_id:state.current});toast("Rapport prêt à compléter");await jobDetail(state.current)}catch(e){alert(e.message)}
}
function visitPayload(){
  const h=Math.max(0,Number($("timeHours")?.value||0)),m=Math.max(0,Math.min(59,Number($("timeMinutes")?.value||0)));
  return {visit_id:currentOpenVisit()?.id,work_done:$("workDone")?.value||"",materials_used:$("materials")?.value||"",remarks:$("remarks")?.value||"",manual_duration_minutes:Math.round(h*60+m)}
}
async function saveChecks(){
  const v=currentOpenVisit();if(!v)return;
  const els=[...document.querySelectorAll("[data-check]")];if(!els.length)return;
  await api("save_checks",{visit_id:v.id,checks:els.map(e=>({id:e.dataset.check,checked:e.checked}))});
}
function bindCheckChanges(){document.querySelectorAll("[data-check]").forEach(e=>e.addEventListener("change",()=>saveChecks().catch(()=>{})))}
async function saveVisit(){
  try{await api("save_visit",visitPayload());await saveChecks();toast("Rapport enregistré")}catch(e){alert(e.message)}
}
async function finishVisit(){
  const p=visitPayload();
  if(!String(p.work_done||"").trim())return alert("Indiquez le travail effectué avant d'envoyer le rapport.");
  if(!Number(p.manual_duration_minutes||0))return alert("Indiquez le temps passé avant d'envoyer le rapport.");
  if(!confirm("Envoyer ce rapport à WAPILOT ?"))return;
  try{await saveChecks();await api("finish_visit",p);toast("Rapport envoyé à WAPILOT");await jobDetail(state.current)}catch(e){alert(e.message)}
}

/* ---------------- PHOTOS ---------------- */
function pickPhotos(type,visitId){
  const input=document.createElement("input");input.type="file";input.accept="image/*";input.multiple=true;input.setAttribute("capture","environment");
  input.onchange=async()=>{const files=[...input.files];if(!files.length)return;openModal(`<h3>Envoi des photos</h3><div id="uploadProgress" class="sub">Préparation…</div>`);let i=0;try{for(const f of files){i++;$("uploadProgress").textContent=`Photo ${i}/${files.length}…`;await uploadPhoto(f,type,visitId)}closeModal();toast("Photos ajoutées");await jobDetail(state.current)}catch(e){closeModal();alert(e.message)}};
  input.click();
}
async function compressImage(file){
  if(!file.type.startsWith("image/"))return file;
  try{
    const bitmap=await createImageBitmap(file),max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const w=Math.round(bitmap.width*scale),h=Math.round(bitmap.height*scale),canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(bitmap,0,0,w,h);
    const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",.82));return blob||file;
  }catch{return file}
}
async function uploadPhoto(file,type,visitId){
  const blob=await compressImage(file),mime=blob.type||file.type||"image/jpeg";
  const sign=await api("photo_upload_url",{visit_id:visitId,photo_type:type,mime_type:mime});
  const {error}=await storageClient.storage.from("technik-interventions").uploadToSignedUrl(sign.path,sign.token,blob,{contentType:mime});
  if(error)throw error;
  await api("register_photo",{visit_id:visitId,photo_type:type,storage_path:sign.path,original_filename:file.name,mime_type:mime,file_size_bytes:blob.size});
}
async function deletePhoto(id){
  if(!confirm("Supprimer cette photo ?"))return;
  try{await api("delete_photo",{photo_id:id});toast("Photo supprimée");await jobDetail(state.current)}catch(e){alert(e.message)}
}

/* ---------------- MODAL ---------------- */
function openModal(body){$("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${body}</div></div>`}
function closeModal(){$("modalRoot").innerHTML=""}

boot();
</script>
