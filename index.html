const CFG={url:"https://ccboibbhsztcupfcrndx.supabase.co",key:"sb_publishable_Dzt9mbx7jw9qYEEJn7NAdg_zp7DPrJ9",fn:"dl-technik-auth"};

    const controller=new AbortController();

    // Sur iOS, une photo importante ou un VPN peut excéder 18 secondes.
    const target=String(typeof input==="string"?input:(input?.url||input||""));

    if(init.signal){if(init.signal.aborted)controller.abort();else init.signal.addEventListener("abort",onAbort,{once:true})}
    return fetch(input,{...init,signal:controller.signal}).finally(()=>{

});
const $=id=>document.getElementById(id);

let offlineRetryTimer=null;

const SYNC_MAX_DELAY=300000;

let backgroundPhotoSyncTimer=null;

let offlineDatabasePromise=null;
function offOpen(){
  if(offlineDatabasePromise)return offlineDatabasePromise;
  offlineDatabasePromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open(OFFLINE_DB_NAME,OFFLINE_DB_VERSION);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("reports"))d.createObjectStore("reports",{keyPath:"job_id"});if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"id"});if(!d.objectStoreNames.contains("photo_sync"))d.createObjectStore("photo_sync",{keyPath:"id"});if(!d.objectStoreNames.contains("photo_binary"))d.createObjectStore("photo_binary",{keyPath:"id"})};
    r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();offlineDatabasePromise=null};resolve(r.result)};

  });return offlineDatabasePromise;
}
async function offPut(store,key,value){
  const d=await offOpen();return new Promise((resolve,reject)=>{
    const tx=d.transaction(store,"readwrite"),object=tx.objectStore(store);
    if(key===undefined)object.put(value);else object.put(value,key);
    tx.oncomplete=()=>resolve(value);tx.onabort=()=>reject(tx.error||new Error("Stockage local indisponible"));tx.onerror=()=>reject(tx.error);
  });
}
async function offGet(store,key){
  const d=await offOpen();
  const original=await new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});

  if(store==="photos"&&original){
    const [status,binary]=await Promise.all([offGet("photo_sync",key),offGet("photo_binary",key)]);

  }
  return original;
}

async function offCreatePhoto(rec,bytes){
  // Métadonnées et octets enregistrés ensemble, en une seule transaction atomique.
  // Les parcours des compteurs ne chargent jamais le fichier des nouvelles photos.
  const d=await offOpen();return new Promise((resolve,reject)=>{
    const tx=d.transaction(["photos","photo_binary"],"readwrite");
    const {blob,bytes:ignored,...metadata}=rec;
    tx.objectStore("photos").put(metadata);
    tx.objectStore("photo_binary").put({id:rec.id,bytes});
    tx.oncomplete=()=>resolve(rec);
    tx.onabort=()=>reject(tx.error||new Error("Enregistrement local des octets interrompu"));
    tx.onerror=()=>reject(tx.error||new Error("Impossible de conserver la photo en mémoire locale"));
  });
}
async function offUpdatePhotoStatus(rec){
  // Stockage petit et indépendant du fichier ; aucun Blob ni ArrayBuffer copié à chaque tentative.
  const {blob,bytes,...meta}=rec;
  if(!meta?.id)throw new Error("Identifiant local de photo manquant");
  await offPut("photo_sync",undefined,meta);
}
function queuedPhotoBlob(rec){
  if(rec?.bytes instanceof ArrayBuffer)return new Blob([rec.bytes],{type:rec.mime_type||"image/jpeg"});
  if(ArrayBuffer.isView(rec?.bytes))return new Blob([rec.bytes],{type:rec.mime_type||"image/jpeg"});
  return rec?.blob instanceof Blob?rec.blob:null;

        await markFailed("photos",{...p,last_stage:"identification du rapport"},err).catch(e=>setPhotoSyncStatus("file locale",String(e?.message||e)));
      }
    }
  };
  await Promise.all(Array.from({length:Math.min(concurrency,items.length)},worker));
}

async function readPhotoBlobBytes(blob,context="ancienne photo"){
  if(!(blob instanceof Blob))throw new Error("Fichier photo local absent.");
  const reasons=[];
  const attempt=async(fn)=>{try{const bytes=await fn();if(bytes instanceof ArrayBuffer&&bytes.byteLength>0)return bytes;throw new Error("Fichier vide")}catch(e){reasons.push(String(e?.name||"Erreur")+": "+String(e?.message||e));return null}};
  let bytes=await attempt(()=>blob.arrayBuffer());if(bytes)return bytes;
  bytes=await attempt(()=>new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("Erreur FileReader"));r.onabort=()=>reject(new Error("Lecture interrompue"));r.readAsArrayBuffer(blob);
  }));if(bytes)return bytes;
  // Dernière tentative pour les anciens Blob IndexedDB d'iOS.
  bytes=await attempt(async()=>{const part=blob.slice(0,blob.size,blob.type);return await part.arrayBuffer()});if(bytes)return bytes;
  bytes=await attempt(async()=>{const u=URL.createObjectURL(blob);try{const response=await fetch(u);if(!response.ok)throw new Error("URL locale non lisible");return await response.arrayBuffer()}finally{URL.revokeObjectURL(u)}});if(bytes)return bytes;
  const detail=reasons.slice(0,2).join(" ; ");
  throw new Error("Photo locale iPhone illisible ("+context+"). Original conservé. "+detail.slice(0,100));
}
async function readQueuedPhotoBytes(rec){
  if(rec?.bytes instanceof ArrayBuffer&&rec.bytes.byteLength)return rec.bytes;
  if(ArrayBuffer.isView(rec?.bytes)&&rec.bytes.byteLength)return rec.bytes.buffer.slice(rec.bytes.byteOffset,rec.bytes.byteOffset+rec.bytes.byteLength);
  if(rec?.blob instanceof Blob)return readPhotoBlobBytes(rec.blob,"ancien stockage IndexedDB");
  throw new Error("Fichier original absent du stockage local. Vérifier la galerie iPhone, sans supprimer l'entrée en attente.");
}
function arrayBufferBase64(buffer){
  const bytes=new Uint8Array(buffer);const chunks=[];const size=8192;
  for(let i=0;i<bytes.length;i+=size)chunks.push(String.fromCharCode(...bytes.subarray(i,i+size)));
  return btoa(chunks.join(""));
}
async function prepareIPhoneProxyPhoto(file){
  // Ne jamais toucher a l'original conserve dans IndexedDB.
  // Les photos > 900 Ko sont reduites pour limiter la quantite de Base64
  // envoyee a la fonction serveur (principal goulot d'etranglement iPhone).
  if(file.size<=IOS_PHOTO_OPTIMIZE_ABOVE_BYTES)return file;
  let bitmap=null,url=null;
  try{
    let drawable,width,height;
    try{bitmap=await createImageBitmap(file);drawable=bitmap;width=bitmap.width;height=bitmap.height}
    catch(_){url=URL.createObjectURL(file);const img=new Image();
      await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error("Decodage iPhone indisponible"));img.src=url});
      drawable=img;width=img.naturalWidth;height=img.naturalHeight}
    if(!width||!height)throw new Error("Dimensions de l'image indisponibles");
    const scale=Math.min(1,IOS_PHOTO_MAX_DIMENSION/Math.max(width,height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(width*scale));
    canvas.height=Math.max(1,Math.round(height*scale));
    const ctx=canvas.getContext("2d",{alpha:false});if(!ctx)throw new Error("Canvas indisponible");
    ctx.drawImage(drawable,0,0,canvas.width,canvas.height);
    const compressed=await new Promise((resolve,reject)=>{
      canvas.toBlob(blob=>blob?.size?resolve(blob):reject(new Error("Compression image impossible")),"image/jpeg",.74);
    });
    if(compressed.size>PHOTO_PROXY_MAX_BYTES){
      if(file.size<=PHOTO_PROXY_MAX_BYTES)return file;
      throw new Error("Photo trop volumineuse apres optimisation");
    }
    // Pour une image deja compacte, ne pas augmenter la taille transferee.
    if(compressed.size>=file.size && file.size<=PHOTO_PROXY_MAX_BYTES)return file;
    return new File([compressed],(file.name||"photo").replace(/\.[^.]+$/ ,"")+".jpg",{type:"image/jpeg"});
  }catch(e){
    // Tous les codecs iOS ne passent pas par Canvas. On peut quand meme
    // transferer le fichier natif lorsqu'il reste sous la limite serveur.
    if(file.size<=PHOTO_PROXY_MAX_BYTES)return file;
    throw new Error("Image trop volumineuse pour le serveur photo (4 Mo) : "+String(e?.message||e));
  }finally{bitmap?.close?.();if(url)URL.revokeObjectURL(url)}
}

async function imageBlobBase64(blob){
  // FileReader.readAsDataURL échouait sur certains Blob iPhone ; utiliser
  // l'ArrayBuffer et encoder les octets directement, sans lecteur d'URL.
  const bytes=await readPhotoBlobBytes(blob,"encodage pour le serveur");
  if(bytes.byteLength>PHOTO_PROXY_MAX_BYTES)throw new Error("Photo iPhone supérieure à 4 Mo après compression.");
  return arrayBufferBase64(bytes);
}

async function proxyUploadIPhonePhoto(photo){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!token)throw new Error("Session iPhone absente. Photos conservées; reconnectez-vous.");
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),150000);
  try{
    const response=await fetch(CFG.url+"/functions/v1/dl-technik-photo-proxy",{
      method:"POST",headers:{"Content-Type":"application/json","apikey":CFG.key,"Authorization":"Bearer "+CFG.key},
      signal:controller.signal,body:JSON.stringify({...photo,device_token:token})
    });
    const result=await response.json().catch(()=>null);
    if(!response.ok){
      if(response.status===404)throw new Error("Fonction dl-technik-photo-proxy non déployée dans Supabase (HTTP 404).");
      if(response.status===401||response.status===403)throw new Error("Accès refusé (HTTP "+response.status+") : vérifier le déploiement de la fonction (verify_jwt=false) et la session.");
      throw new Error("Serveur photo (HTTP "+response.status+")"+(result?.stage?" · "+String(result.stage).slice(0,80):"")+" : "+String(result?.error||result?.message||"réponse non reconnue"));
    }
    if(!result?.ok)throw new Error("Aucune confirmation du serveur photo : "+String(result?.error||"réponse inattendue"));
    return result;
  }catch(error){
    if(error?.name==="AbortError")throw new Error("Délai dépassé lors de l'envoi au serveur photo iPhone (150 s).");
    throw error;
  }finally{clearTimeout(timer)}
}

async function recoverQueuedPhotoVisit(p){
  const report=await offGet("reports",p.job_id);
  if(report?.visit_id&&!String(report.visit_id).startsWith("local-"))return report.visit_id;
  if(p.visit_id&&!String(p.visit_id).startsWith("local-"))return p.visit_id;
  setPhotoSyncStatus("rapport serveur", "Recherche du passage correspondant aux photos en attente");
  const detail=await api("job_detail",{job_id:p.job_id},{skipOffline:true,timeoutMs:18000});
  const status=String(detail?.job?.status||"");
  const mine=String(p.technician_id||me?.technician_id||me?.id||"");
  const candidates=(detail.visits||[]).filter(v=>["draft","in_progress"].includes(v.status)&&String(v.technician_id||"")===mine);
  if(candidates.length>1)throw new Error("Plusieurs rapports du même technicien sont ouverts. Rattachement automatique impossible.");
  if(candidates.length===0&&!["draft","assigned","in_progress"].includes(status))
    throw new Error("L'intervention est déjà clôturée ou envoyée. Les photos sont conservées : vérifier le rapport dans WAPILOT.");
  const visitId=candidates.length===1?candidates[0].id:
    (await api("prepare_visit",{job_id:p.job_id},{skipOffline:true,timeoutMs:18000}))?.visit?.id;
  if(!visitId)throw new Error("Le serveur n'a pas fourni l'identifiant du rapport.");
  // Conserver les autres champs des photos ; aucun blob n'est modifié/supprimé.
  const pending=(await offPhotoMetas()).filter(x=>String(x.job_id)===String(p.job_id)&&!x.visit_id&&isOwnQueuedItem(x));
  for(const item of pending){const original=await offGet("photos",item.id);if(original&&!original.visit_id)await offUpdatePhotoStatus({...original,visit_id:visitId})}
  if(report&&!report.visit_id){const latest=await offGet("reports",p.job_id);if(latest&&!latest.visit_id)await offPut("reports",undefined,{...latest,visit_id:visitId,next_retry_at:0})}
  setPhotoSyncStatus("rapport serveur", "Passage retrouvé ; reprise du transfert des photos");
  return visitId;
}
async function syncOneQueuedPhoto(p,visitId){
  if(deletingJobIds.has(String(p.job_id)))return false;
  let current=await offGet("photos",p.id);
  if(!current||current.next_retry_at>Date.now()||!isOwnQueuedItem(current))return false;
  if(current.sync_state==="uploading")current={...current,sync_state:"local"}; // crash recovery
  // Ne jamais ignorer les photos en 2G : le VPN et Safari peuvent rapporter
  // un débit trompeur. Réessayer avec compression et délai prolongé.
  if(!photoNetworkReady())return false;
  let stage="préparation";
  try{
    setPhotoSyncStatus("photo", "Préparation du transfert");
    await offUpdatePhotoStatus({...current,sync_state:"uploading"});
    updatePhotoSyncPanel().catch(()=>{});
    const uploadingEl=document.querySelector(`[data-photo-id="${CSS.escape(current.id)}"]`);if(uploadingEl){uploadingEl.classList.add("syncing-photo");uploadingEl.classList.remove("failed-photo")}
    // Reuse one signed path, even after network timeouts, instead of creating duplicates.
    if(current.storage_path&&!isIOSPhotoDevice()){
      const existing=await callRemotePhotoExists(current,visitId);
      if(existing){await completeQueuedPhoto(current,existing);return true}
    }
    // L'original reste conserve localement jusqu'a l'accuse de reception serveur.
    const sourceMime=current.mime_type||"image/jpeg";
    const ios=isIOSPhotoDevice();
    const remoteType=current.photo_type==="syndic"?"other":current.photo_type;
    if(ios){
      // Une seule image iOS est decodee/compressee a la fois : le second
      // transfert peut progresser pendant la preparation de la suivante.
      stage="preparation photo iPhone";
      const prepared=await withIOSPhotoPreparation(async()=>{
        const sourceBytes=await readQueuedPhotoBytes(current);
        const original=new File([sourceBytes],current.original_filename||"photo.jpg",{type:sourceMime});
        const proxyFile=await prepareIPhoneProxyPhoto(original);
        const base64=await imageBlobBase64(proxyFile);
        return {base64,name:proxyFile.name,mime:proxyFile.type||"image/jpeg",size:proxyFile.size,originalSize:original.size};
      });
      stage="envoi via serveur photo iPhone";
      setPhotoSyncStatus(stage,"Transfert en cours ("+Math.round(prepared.size/1024)+" Ko / "+Math.round(prepared.originalSize/1024)+" Ko d'origine)");
      const proxy=await proxyUploadIPhonePhoto({
        visit_id:visitId,photo_type:remoteType,client_photo_id:current.id,
        mime_type:prepared.mime,original_filename:prepared.name,
        file_size_bytes:prepared.size,caption:current.photo_type==="syndic"?SYNDIC_PHOTO_CAPTION:null,
        existing_storage_path:current.storage_path||null,image_base64:prepared.base64
      });
      if(!proxy?.ok||!proxy?.photo_id||!proxy?.storage_path)throw new Error("La fonction photo iPhone n'a pas confirme l'enregistrement.");
      await completeQueuedPhoto(current,{id:proxy.photo_id,visit_id:visitId,storage_path:proxy.storage_path});
      return true;
    }
    // Android: aucun changement du traitement existant.
    stage="lecture du fichier original";
    const sourceBytes=await readQueuedPhotoBytes(current);
    const sourceFile=new File([sourceBytes],current.original_filename||"photo.jpg",{type:sourceMime});
    stage="lecture / compression locale";
    const file=await compressImage(sourceFile);
    const mime=file.type||sourceMime;
    // Android: conserver strictement le chemin de transfert déjà fonctionnel.
    if(!current.storage_path||!current.signed_token){
      stage="autorisation serveur";
      const sign=await api("photo_upload_url",{visit_id:visitId,photo_type:remoteType,mime_type:mime},{skipOffline:true,timeoutMs:20000});
      current.storage_path=sign.path;current.signed_token=sign.token;
      await offUpdatePhotoStatus(current);
    }
    const uploadBody=file;
    stage="transfert Storage";
    const up=await storageClient.storage.from("technik-interventions")
      .uploadToSignedUrl(current.storage_path,current.signed_token,uploadBody,{contentType:mime,cacheControl:"3600"});
    // Après une réponse perdue, le chemin reste identique ; 409 signifie déjà chargé.
    if(up.error&&!/already exists|duplicate|conflict|409/i.test(String(up.error.message||up.error))){
      if(/expired|jwt|unauthori|invalid token|403/i.test(String(up.error.message||up.error))){
        current.storage_path=null;current.signed_token=null;
        await offUpdatePhotoStatus(current);
      }
      throw new Error(`Transfert photo : ${String(up.error.message||up.error)}`);
    }
    stage="confirmation de la photo";
    const result=await api("register_photo",{visit_id:visitId,photo_type:remoteType,storage_path:current.storage_path,original_filename:current.original_filename,mime_type:mime,file_size_bytes:file.size,caption:current.photo_type==="syndic"?SYNDIC_PHOTO_CAPTION:null},{skipOffline:true,timeoutMs:20000});
    await completeQueuedPhoto(current,{id:result.photo_id,visit_id:visitId,storage_path:current.storage_path});
    return true;
  }catch(err){
    // Message court lisible dans le panneau, original conservé.
    setPhotoSyncStatus(stage, String(err?.message||err));
    await markFailed("photos",{...current,last_stage:stage},err);
    return false;
  }
}

async function syncOneQueuedReport(r){
  if(deletingJobIds.has(String(r.job_id)))return;
  if(!isOwnQueuedItem(r)||r.next_retry_at>Date.now()||!navigator.onLine)return;
  const originalUpdated=r.updated_at;
  let visitId=r.visit_id;
  try{
    if(!visitId){
      const prep=await api("prepare_visit",{job_id:r.job_id},{skipOffline:true,timeoutMs:10000});
      visitId=prep.visit?.id||prep.visit_id;
      if(!visitId)throw new Error("Impossible de préparer le rapport.");
      const latest=await offGet("reports",r.job_id);if(!latest)return;
      await offPut("reports",undefined,{...latest,visit_id:visitId});
    }
    await api("save_visit",{...r.payload,visit_id:visitId},{skipOffline:true,timeoutMs:10000});
    if(r.checks?.length)await api("save_checks",{visit_id:visitId,checks:r.checks},{skipOffline:true,timeoutMs:10000});
    const pending=(await offPhotoMetas()).filter(p=>p.job_id===r.job_id);
    await syncQueuedPhotoBatch(pending,async()=>visitId);
    // Keep the report queued until ALL photos have a real remote visit ID and
    // are acknowledged; otherwise a newly-created offline visit can orphan them.
    if((await offPhotoMetas()).some(p=>p.job_id===r.job_id))return;
    if(r.submit){
      // Retry of an uncertain finish is preceded by a server-state check.
      const d=await api("job_detail",{job_id:r.job_id},{skipOffline:true,timeoutMs:10000});
      if(!["report_received","validated","archived"].includes(d.job?.status)&&
         !(d.visits||[]).some(v=>v.id===visitId&&["submitted","validated"].includes(v.status)))
        await api("finish_visit",{...r.payload,visit_id:visitId},{skipOffline:true,timeoutMs:10000});
    }
    const latest=await offGet("reports",r.job_id);
    if(latest?.updated_at===originalUpdated){await offDelete("reports",r.job_id)}
    else if(latest)await offPut("reports",undefined,{...latest,next_retry_at:0,sync_state:"local"});
    if(r.submit){queuedSubmitIds.delete(String(r.job_id));refreshGlobalSyncToolbar().catch(()=>{});}
    if(r.submit&&activeTechnikView==="detail"&&String(state.current)===String(r.job_id)){
      // Never reopen a report when the technician already moved to the next job.
      if(!document.activeElement?.matches("input,textarea,select"))jobDetail(r.job_id).catch(console.warn);
    }
  }catch(err){await markFailed("reports",r,err)}
}
async function syncOfflineQueue(){
  if(!photoNetworkReady()||offlineSyncRunning||!me)return;
  offlineSyncRunning=true;
  setPhotoSyncStatus("file", "Analyse des rapports et photos en attente");
  await refreshNetworkBadge().catch(()=>{});
  try{
    const reports=(await offAll("reports")).filter(isOwnQueuedItem);
    for(const r of reports)await syncOneQueuedReport(r);
    const remaining=(await offPhotoMetas()).filter(isOwnQueuedItem);
    const visitResolvers=new Map();
    await syncQueuedPhotoBatch(remaining,async p=>{
      const report=await offGet("reports",p.job_id);
      let visitId=p.visit_id||report?.visit_id;
      if(visitId&&!String(visitId).startsWith("local-"))return visitId;
      // Deux travailleurs ne doivent jamais creer deux visites en parallele.
      const key=String(p.job_id);
      if(!visitResolvers.has(key))visitResolvers.set(key,recoverQueuedPhotoVisit(p));
      return await visitResolvers.get(key);
    });
  }catch(e){
    // Auparavant, cette erreur n'était visible que dans la console Safari.
    setPhotoSyncStatus("file",String(e?.message||e));
  }finally{
    offlineSyncRunning=false;
    await refreshNetworkBadge().catch(()=>{});
    await updatePhotoSyncPanel().catch(()=>{});
    try{if(await offPendingCount())queueRetry()}catch(e){setPhotoSyncStatus("file locale",String(e?.message||e))}
  }
}

async function api(action,payload={},options={}){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!navigator.onLine&&OFFLINE_READ_ACTIONS.has(action)&&!options.skipOffline){
    const cached=await offReadApi(action,payload);if(cached)return cached;
    throw new Error("Pas de réseau et ces données n'ont pas encore été synchronisées sur ce téléphone.");
  }
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),options.timeoutMs||(options.skipOffline?10000:9000));
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":CFG.key,"Authorization":"Bearer "+CFG.key},signal:controller.signal,body:JSON.stringify({action,device_name:deviceName(),device_token:token,...payload})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      if(j.error==="SESSION_INVALID"){
        // Keep pending local data; a network error must never clear the PIN session.
        localStorage.removeItem(TOKEN_KEY);me=null;showAuth();throw new Error("Session expirée.");
      }
      throw new Error(j.error||"Erreur de connexion.");
    }

  }catch(e){
    if(!options.skipOffline&&OFFLINE_READ_ACTIONS.has(action)&&offNetworkError(e)){
      const cached=await offReadApi(action,payload);if(cached)return cached;
    }
    throw e;
  }finally{clearTimeout(timer)}
}

function visitTimeValue(iso){
  if(!iso)return "";
  try{

}
function visitIsoFromTime(dateValue,timeValue){

function calcVisitMinutes(arrival,departure){
  if(!arrival||!departure)return 0;
  const [ah,am]=arrival.split(":").map(Number),[dh,dm]=departure.split(":").map(Number);
  const a=ah*60+am,d=dh*60+dm;
  return d>a?d-a:0;
}
function formatAutoDuration(mins){

}

async function pickPhotoSeries(type,visitId){
  if(cameraStream||document.querySelector('.camera-modal,.camera-series-native'))return;
  cameraPhotoType=type;cameraVisitId=visitId;cameraShots=[];
  if(navigator.mediaDevices?.getUserMedia){
    try{
      // L'appel getUserMedia doit être déclenché avant toute opération asynchrone
      // sur iOS/PWA pour préserver le geste utilisateur.
      await startCamera();
      if(!await saveVisit(true)){
        stopCamera();
        throw new Error('Impossible de sauvegarder le brouillon avant les photos.');
      }
      renderCamera();
      return;
    }catch(e){
      console.warn('Caméra en série indisponible sur cet iPhone',e);
      stopCamera();
      showNativeCameraSeries(e);

    }
  }
  showNativeCameraSeries(new Error('Caméra intégrée indisponible.'));
}
function cameraSeriesTitle(){

// Secours iOS lorsque getUserMedia est interdit : chaque touche sur « Prendre »

async function retryCameraSeriesIntegrated(){
  if(cameraCaptureBusy)return;
  // Le clic sur le bouton constitue un nouveau geste utilisateur pour la caméra.
  const type=cameraPhotoType,visitId=cameraVisitId;
  const previousShots=cameraShots.slice();
  $("modalRoot").innerHTML='';
  cameraShots=[];
  try{
    await startCamera();
    cameraPhotoType=type;cameraVisitId=visitId;cameraShots=previousShots;

async function handleNativeSeriesPhoto(input){
  if(cameraCaptureBusy)return;
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  cameraCaptureBusy=true;
  // Garder le champ d'origine dans le DOM jusqu'à lecture des octets iOS.
  try{
    if(!await saveVisit(true))throw new Error('Brouillon non sauvegardé : la photo n’a pas pu être conservée.');
    for(const file of files){
      try{
        const rec=await uploadPhoto(file,cameraPhotoType,cameraVisitId);
        // Prévisualisation produite à partir de l'instantané binaire local sécurisé.
        const stored=await offGet('photos',rec.id);
        const preview=queuedPhotoBlob(stored);
        cameraShots.push({id:rec.id,url:preview?URL.createObjectURL(preview):'',name:file.name||'photo'});
        refreshCameraShots();
      }catch(e){console.warn('Photo native non sauvegardée',e);alert('Impossible de conserver cette photo : '+String(e?.message||e))}
    }
  }catch(e){alert(String(e?.message||e))}
  finally{input.value='';cameraCaptureBusy=false;refreshCameraShots()}
}
function finishCameraSeries(){
  if(cameraCaptureBusy){toast('Enregistrement photo en cours…');return}
  uploadCameraShots();
}
async function handleNativePhotoFiles(input,type,visitId){
  // This callback starts only AFTER iOS returns the selected file. It is therefore
  // safe to await IndexedDB here, unlike before opening the native picker.
  const files=Array.from(input?.files||[]);
  if(!files.length)return;
  if(!await saveVisit(true)){
    alert("Impossible de sécuriser le brouillon sur cet iPhone. La photo n'a pas encore été enregistrée : vérifiez l'espace disponible, puis réessayez. N'effacez pas les données de DL TECHNIK.");
    return;
  }
  let saved=0;
  for(const file of files){
    try{await uploadPhoto(file,type,visitId);saved++}
    catch(e){console.warn("Échec de l'enregistrement local d'une photo",e);alert("Photo non sauvegardée ("+(file.name||"nouvelle photo")+") : "+e.message)}
  }
  if(saved){
    input.value="";
    toast(`${saved} photo${saved>1?"s":""} enregistrée${saved>1?"s":""} sur le téléphone`);
    scheduleBackgroundPhotoSync(250);
  }
}

let cameraStream=null;

async function pickPhotos(type,visitId){

  if(!await saveVisit(true)){

function retryIntegratedCamera(){

async function startCamera(deviceId=null){
  stopCamera();

  cameraDeviceId=cameraStream.getVideoTracks()[0]?.getSettings?.().deviceId||deviceId;
  cameraCapabilities=cameraStream.getVideoTracks()[0]?.getCapabilities?.()||{};
  const zoom=cameraCapabilities.zoom;
  cameraZoom=zoom&&Number.isFinite(zoom.min)&&Number.isFinite(zoom.max)?Math.max(zoom.min,Math.min(zoom.max,1)):1;
  try{
    cameraCameras=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"&&d.deviceId);
  }catch{cameraCameras=[]}
}
function renderCamera(){
  $("modalRoot").innerHTML=`<div class="camera-modal">
    <div class="camera-top"><b>${cameraSeriesTitle()}</b><button class="camera-close" onclick="closeCamera()" aria-label="Fermer">×</button></div>
    <div class="camera-stage" id="cameraStage"><video id="cameraVideo" autoplay playsinline muted></video><div class="camera-guide"></div></div>
    <div class="camera-bottom">
      <div class="camera-controls" id="cameraControls"></div>

      <div id="cameraPreviews" class="camera-previews"></div>
    </div>
  </div>`;
  const video=$("cameraVideo");video.srcObject=cameraStream;video.play().catch(()=>{});
  const stage=$("cameraStage");
  stage.addEventListener("touchstart",e=>{if(e.touches.length===2)cameraTouchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
  stage.addEventListener("touchmove",e=>{if(e.touches.length!==2||!cameraTouchDistance||!cameraCapabilities?.zoom)return;e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(Math.abs(dist-cameraTouchDistance)>18){changeCameraZoom(cameraZoom*(dist/cameraTouchDistance));cameraTouchDistance=dist}},{passive:false});

function renderCameraControls(){
  const el=$("cameraControls");if(!el)return;
  const zoom=cameraCapabilities?.zoom;
  const hasZoom=zoom&&Number.isFinite(zoom.min)&&Number.isFinite(zoom.max)&&zoom.max>zoom.min;
  const min=hasZoom?Number(zoom.min):1,max=hasZoom?Number(zoom.max):1;
  // 0.5× is not shown merely because a phone has several physical sensors.
  const wide=hasZoom&&min<=0.5;
  const quick=[...(wide?[0.5]:[]),...(hasZoom&&min<=1&&max>=1?[1]:[]),...(hasZoom&&max>=2?[2]:[])];
  const cams=cameraCameras.filter(c=>c.deviceId);
  el.innerHTML=`${hasZoom?`<div class="camera-zoombar">${quick.map(v=>`<button class="camera-zoom-choice ${Math.abs(cameraZoom-v)<0.08?"on":""}" onclick="changeCameraZoom(${v})">${v===0.5?"0,5":v}×</button>`).join("")}<span class="camera-zoom-current">${cameraZoom.toFixed(1).replace(".",",")}×</span><input aria-label="Niveau de zoom" class="camera-zoom-range" type="range" min="${min}" max="${max}" value="${cameraZoom}" step="${Math.max(0.05,(max-min)/80)}" oninput="changeCameraZoom(Number(this.value))"></div>`:""}
    ${cams.length>1?`<select class="camera-device" aria-label="Choisir l’objectif" onchange="switchCamera(this.value)">${cams.map((c,i)=>`<option value="${esc(c.deviceId)}" ${c.deviceId===cameraDeviceId?"selected":""}>${esc(c.label||`Caméra ${i+1}`)}</option>`).join("")}</select>`:""}`;
}
async function changeCameraZoom(value){
  const track=cameraStream?.getVideoTracks?.()[0],zoom=cameraCapabilities?.zoom;
  if(!track||!zoom)return;
  const target=Math.max(zoom.min,Math.min(zoom.max,value));
  try{await track.applyConstraints({advanced:[{zoom:target}]});cameraZoom=track.getSettings?.().zoom??target;renderCameraControls()}
  catch(e){console.warn("Zoom non autorisé",e)}
}
async function switchCamera(id){
  if(!cameraCameras.some(c=>c.deviceId===id))return;
  const previous=cameraDeviceId;
  try{await startCamera(id);renderCamera()}
  catch(e){
    alert("Cette caméra n'est pas accessible : "+e.message);
    try{await startCamera(previous);renderCamera()}catch(err){closeCamera();console.warn(err)}
  }
}
async function captureShot(){
  const video=$("cameraVideo");if(!video||!video.videoWidth||cameraCaptureBusy)return;
  cameraCaptureBusy=true;
  try{
    const max=1800,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
    canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
    const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",.84));
    if(!blob)throw new Error("Impossible de sauvegarder cette photo.");
    const name=`photo-${Date.now()}-${cameraShots.length+1}.jpg`;
    const record=await uploadPhoto(new File([blob],name,{type:"image/jpeg"}),cameraPhotoType,cameraVisitId);
    cameraShots.push({id:record.id,url:URL.createObjectURL(blob),name});
    refreshCameraShots();
  }catch(e){alert("La photo n'a pas pu être conservée sur le téléphone : "+e.message)}
  finally{cameraCaptureBusy=false}
}
function refreshCameraShots(){
  const c=$("cameraCounter"),p=$("cameraPreviews");
  if(c)c.textContent=`${cameraShots.length} photo${cameraShots.length>1?"s":""} enregistrée${cameraShots.length>1?"s":""} localement`;
  if(p)p.innerHTML=cameraShots.map((s,i)=>`<div class="camera-preview"><img src="${s.url}"><button onclick="removeCameraShot(${i})">×</button></div>`).join("");
}
async function removeCameraShot(i){
  const s=cameraShots[i];if(!s)return;
  const record=await offGet("photos",s.id);
  if(!record||record.sync_state==="uploading")return alert("Cette photo est déjà en cours de transfert. Supprimez-la depuis le rapport une fois synchronisée.");
  if(!confirm("Supprimer cette photo enregistrée localement ?"))return;
  await deletePhoto(s.id,true);
  URL.revokeObjectURL(s.url);cameraShots.splice(i,1);refreshCameraShots();
}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function closeCamera(){if(cameraCaptureBusy){toast('Enregistrement photo en cours…');return}stopCamera();cameraShots.forEach(s=>{if(s.url)URL.revokeObjectURL(s.url)});cameraShots=[];$("modalRoot").innerHTML=""}
async function uploadCameraShots(){if(cameraCaptureBusy){toast('Enregistrement photo en cours…');return}const count=cameraShots.length;closeCamera();if(count)toast(`${count} photo${count>1?'s':''} sécurisée${count>1?'s':''} · synchronisation automatique`);scheduleBackgroundPhotoSync(150)}
function pickGalleryFromCamera(){
  const type=cameraPhotoType,visitId=cameraVisitId;
  closeCamera();pickGallery(type,visitId);
}
function pickGallery(type,visitId){openNativePhotoPicker(type,visitId,false)}
function openNativePhotoPicker(type,visitId,camera=false){
  // File selection must be initiated synchronously by an explicit user tap on iOS.
  // Keep the input in the DOM while the native picker is being presented.
  const input=document.createElement("input");
  input.type="file";input.accept="image/*";
  if(camera)input.setAttribute("capture","environment");
  else input.multiple=true;
  input.setAttribute("aria-label",camera?"Appareil photo du téléphone":"Galerie photo");
  input.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
  document.body.appendChild(input);
  input.addEventListener("cancel",()=>input.remove(),{once:true});
  input.addEventListener("change",async()=>{
    const files=Array.from(input.files||[]);
    if(!files.length){input.remove();return}
    let saved=0;
    try{
      // Safari peut rendre les objets File illisibles après détachement de l'input.
      // Garder l'input dans le document jusqu'à la fin des captures binaires.
      for(const file of files){
        try{await uploadPhoto(file,type,visitId);saved++}
        catch(e){alert(`Enregistrement local impossible (${file.name}): ${e.message}`)}
      }
    }finally{input.remove()}
    if(saved)toast(`${saved} photo${saved>1?"s":""} sécurisée${saved>1?"s":""} localement`);
  },{once:true});
  try{input.click()}catch(e){input.remove();alert("Impossible d'ouvrir le sélecteur photo : "+e.message)}
}
async function compressImage(file){
  if(!file.type.startsWith("image/"))return file;
  let bitmap=null,localUrl=null;
  try{
    // createImageBitmap peut échouer sur certains formats HEIC d'iPhone.
    let width,height,drawable;
    try{bitmap=await createImageBitmap(file);drawable=bitmap;width=bitmap.width;height=bitmap.height}
    catch(_){
      localUrl=URL.createObjectURL(file);
      const img=new Image();
      await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=localUrl});
      drawable=img;width=img.naturalWidth;height=img.naturalHeight;
    }
    const networkConstrained=weakNetwork()||navigator.connection?.saveData;
    const max=networkConstrained?1280:1600;
    const scale=Math.min(1,max/Math.max(width,height));
    const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});if(!ctx)throw new Error("Canvas inaccessible");
    ctx.drawImage(drawable,0,0,w,h);
    const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",networkConstrained?.72:.78));
    if(!blob?.size)throw new Error("Image non décodable");
    // Pas d'intérêt à rendre un fichier déjà compressé plus lourd.
    const heic=/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name||"");
    return (blob.size<file.size||heic)?new File([blob],(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}):file;
  }catch(e){console.warn("Compression non disponible, image originale conservée",e);return file}
  finally{bitmap?.close?.();if(localUrl)URL.revokeObjectURL(localUrl)}
}
async function uploadPhoto(file,type,visitId){return {queued:true,id:(await offQueuePhoto(file,type,visitId)).id}}
async function deletePhoto(id,alreadyConfirmed=false){
  if(!alreadyConfirmed&&!confirm("Supprimer cette photo ?"))return;
  if(String(id).startsWith("local-photo-")){
    const rec=await offGet("photos",id);
    if(!rec)return alert("La photo vient d'être synchronisée. Actualisez le rapport avant de la supprimer.");
    if(rec.sync_state==="uploading")return alert("Transfert en cours. Réessayez après la synchronisation.");
    await offDelete("photos",id);
    state.currentDetail.photos=(state.currentDetail.photos||[]).filter(p=>String(p.id)!==String(id));
    toast("Photo locale supprimée");renderDetail();await refreshNetworkBadge();return;
  }
  try{await api("delete_photo",{photo_id:id});toast("Photo supprimée");await jobDetail(state.current)}catch(e){alert(e.message)}
}
const deletingJobIds=new Set();
let deletePermissionRequest=0;
function setDeleteStatus(message,enabled=false,warning=false){
  const btn=$("deleteUnsentBtn"),status=$("deleteUnsentStatus");
  if(btn)btn.disabled=!enabled;
  if(status){status.textContent=message;status.classList.toggle("delete-state-allowed",enabled);status.classList.toggle("delete-state-warning",warning)}
}
async function deleteLocalState(jobId){
  await offDelete("reports",jobId);
  const photos=(await offPhotoMetas()).filter(p=>String(p.job_id)===String(jobId));
  for(const p of photos)await offDelete("photos",p.id);
  await Promise.all([
    offDelete("kv",offCacheKey("job_detail",{job_id:jobId})),
    offDelete("kv",offCacheKey("list_jobs",{mode:"active"})),
    offDelete("kv",offCacheKey("list_jobs",{mode:"completed"})),
    offDelete("kv",offCacheKey("dashboard",{}))
  ]);
}
async function checkCanDeleteUnsent(){
  const jobId=state.current,el=$("deleteDraftAction");
  if(!el||!jobId)return;
  const request=++deletePermissionRequest;
  setDeleteStatus("Vérification de l'autorisation Supabase…");
  if(!navigator.onLine){setDeleteStatus("Connexion nécessaire pour vérifier le droit de suppression.",false,true);return}
  if(deletingJobIds.has(String(jobId))){setDeleteStatus("Annulation en cours…");return}
  try{
    const [report,photos]=await Promise.all([offGet("reports",jobId),offPhotoMetas()]);
    if(state.current!==jobId||request!==deletePermissionRequest)return;
    if(report?.submit){setDeleteStatus("Ce rapport a été marqué pour envoi : suppression bloquée par sécurité.",false,true);return}
    if(offlineSyncRunning||photos.some(p=>String(p.job_id)===String(jobId)&&p.sync_state==="uploading")){
      setDeleteStatus("Synchronisation en cours : réessayez une fois les transferts terminés.",false,true);return;
    }
    const r=await api("can_delete_unsubmitted_job",{job_id:jobId},{skipOffline:true,timeoutMs:6000});
    if(state.current!==jobId||request!==deletePermissionRequest||!$("deleteDraftAction"))return;
    if(String(r?.job_id)!==String(jobId)||r?.allowed!==true){
      setDeleteStatus(r?.reason||"Suppression non autorisée : intervention déjà transmise, créée ailleurs ou attribuée à un autre technicien.",false,true);
      return;
    }
    setDeleteStatus("Autorisation confirmée : intervention non envoyée, suppression possible.",true);
  }catch(e){
    if(state.current===jobId&&request===deletePermissionRequest){
      setDeleteStatus("Suppression indisponible : activer les deux actions dans la fonction Supabase « dl-technik-auth ». Réessayez après activation.",false,true);
    }
  }
}
async function deleteUnsentIntervention(){
  const btn=$("deleteUnsentBtn");
  if(!btn||btn.disabled||!state.current)return;
  await cancelJobWithConfirmation(state.current,btn);
}
async function deleteUnsentFromList(jobId,btn){
  if(!btn||btn.disabled)return;
  // La liste ne confère jamais une autorisation : vérification Supabase obligatoire.
  await cancelJobWithConfirmation(jobId,btn);
}
async function cancelJobWithConfirmation(jobId,btn){
  jobId=String(jobId||"");
  if(!jobId||deletingJobIds.has(jobId))return;
  if(!navigator.onLine)return alert("La suppression nécessite une connexion pour confirmer les droits dans Supabase.");
  if(offlineSyncRunning)return alert("Une synchronisation est en cours. Réessayez lorsque les transferts seront terminés.");
  deletingJobIds.add(jobId); // Empêche tout nouveau transfert de ce rapport pendant la vérification.
  const initialLabel=btn?.textContent||"Supprimer";
  if(btn){btn.disabled=true;btn.textContent="Vérification…"}
  let confirmed=false;
  try{
    // Les écritures locales déjà commencées doivent être terminées avant toute annulation.
    await localReportWrites;
    const [report,photos]=await Promise.all([offGet("reports",jobId),offPhotoMetas()]);
    if(report?.submit)throw new Error("Un rapport attend son envoi : suppression interdite.");
    if(offlineSyncRunning||photos.some(p=>String(p.job_id)===jobId&&p.sync_state==="uploading"))
      throw new Error("Un transfert est en cours : réessayez après synchronisation.");
    const permission=await api("can_delete_unsubmitted_job",{job_id:jobId},{skipOffline:true,timeoutMs:9000});
    if(permission?.allowed!==true||String(permission?.job_id)!==jobId)
      throw new Error(permission?.reason||"Suppression non autorisée : cette intervention n'a pas été créée par vous depuis DL TECHNIK, ou elle a déjà été envoyée.");
    if(!confirm("Supprimer cette intervention créée par vous dans DL TECHNIK ? Cette opération l'annulera dans WAPILOT. Les photos et les brouillons locaux seront ensuite retirés."))return;
    if(btn)btn.textContent="Annulation…";
    // Une seconde lecture protège les brouillons ajoutés durant la confirmation.
    const [recentReport,recentPhotos]=await Promise.all([offGet("reports",jobId),offPhotoMetas()]);
    if(recentReport?.submit||offlineSyncRunning||recentPhotos.some(p=>String(p.job_id)===jobId&&p.sync_state==="uploading"))
      throw new Error("Envoi ou transfert démarré pendant la confirmation.");
    // Seule la RPC transactionnelle V3.9.2 décide réellement de l'annulation.
    const result=await api("cancel_unsubmitted_job",{job_id:jobId},{skipOffline:true,timeoutMs:12000});
    if(result?.ok!==true||String(result?.job_id)!==jobId)
      throw new Error("Le serveur n'a pas confirmé l'annulation.");
    confirmed=true;
    try{
      await deleteLocalState(jobId);
      toast("Intervention annulée");
    }catch(cleanError){
      alert("Intervention annulée sur Supabase, mais le nettoyage local est incomplet : "+cleanError.message+". Ne réenvoyez pas ce rapport.");
    }
    // Invalide la liste affichée et recharge après confirmation du serveur.
    state.jobs=(state.jobs||[]).filter(j=>String(j.id)!==jobId);
    if(state.current===jobId){state.current=null;state.currentDetail=null}
    await go("jobs");
  }catch(e){
    if(!confirmed)alert("Suppression non confirmée : "+e.message+". Données locales conservées. Vérifiez l'état de l'intervention avant de réessayer.");
    else console.warn("Annulation confirmée, erreur de rafraîchissement",e);
  }finally{
    deletingJobIds.delete(jobId);
    if(btn?.isConnected){btn.disabled=false;btn.textContent=initialLabel}
    if(!confirmed&&state.current===jobId&&$("deleteDraftAction"))checkCanDeleteUnsent().catch(console.warn);
    scheduleBackgroundPhotoSync(1000);
  }
}

function openModal(body){$("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${body}</div></div>`}
function closeModal(){stopCamera?.();$("modalRoot").innerHTML=""}

boot();
