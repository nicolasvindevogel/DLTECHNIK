<script>
const CFG={url:"https://ccboibbhsztcupfcrndx.supabase.co",key:"sb_publishable_Dzt9mbx7jw9qYEEJn7NAdg_zp7DPrJ9",fn:"dl-technik-auth"};

const $=id=>document.getElementById(id);

const OFFLINE_DB_NAME="dl_technik_offline_v1",OFFLINE_DB_VERSION=1;

let offlineRetryTimer=null;
let reportSaveTimer=null;
let localReportWrites=Promise.resolve();
const SYNC_MAX_DELAY=300000;
const isOwnQueuedItem=r=>!!me&&(!r.technician_id||String(r.technician_id)===String(me?.technician_id||me?.id||""));
function syncBackoff(attempt=1){return Math.min(SYNC_MAX_DELAY,4000*Math.pow(2,Math.min(6,Math.max(0,attempt-1))))+Math.floor(Math.random()*900)}
function queueRetry(){
  if(offlineRetryTimer)clearTimeout(offlineRetryTimer);
  if(!navigator.onLine||!me)return;
  offlineRetryTimer=setTimeout(()=>{offlineRetryTimer=null;syncOfflineQueue().catch(console.warn)},15000);
}
function abortIsNetworkError(e){return e?.name==="AbortError"||e?.name==="TimeoutError"}
function weakNetwork(){return ["slow-2g","2g"].includes(navigator.connection?.effectiveType)}

let backgroundPhotoSyncTimer=null;
const OFFLINE_READ_ACTIONS=new Set(["session","dashboard","list_jobs","reference_data","job_detail"]);
let offlineDatabasePromise=null;
function offOpen(){
  if(offlineDatabasePromise)return offlineDatabasePromise;
  offlineDatabasePromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open(OFFLINE_DB_NAME,OFFLINE_DB_VERSION);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("reports"))d.createObjectStore("reports",{keyPath:"job_id"});if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"id"})};
    r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();offlineDatabasePromise=null};resolve(r.result)};
    r.onerror=()=>{offlineDatabasePromise=null;reject(r.error)};
    r.onblocked=()=>{offlineDatabasePromise=null;reject(new Error("Fermez les autres onglets DL TECHNIK puis réessayez."))};
  });return offlineDatabasePromise;
}
async function offPut(store,key,value){
  const d=await offOpen();return new Promise((resolve,reject)=>{
    const tx=d.transaction(store,"readwrite"),object=tx.objectStore(store);
    if(key===undefined)object.put(value);else object.put(value,key);
    tx.oncomplete=()=>resolve(value);tx.onabort=()=>reject(tx.error||new Error("Stockage local indisponible"));tx.onerror=()=>reject(tx.error);
  });
}
async function offGet(store,key){const d=await offOpen();return new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function offDelete(store,key){const d=await offOpen();return new Promise((resolve,reject)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).delete(key);tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||new Error("Suppression locale impossible"));tx.onerror=()=>reject(tx.error)})}
async function offAll(store){const d=await offOpen();return new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function offCount(store){const d=await offOpen();return new Promise((resolve,reject)=>{const r=d.transaction(store,"readonly").objectStore(store).count();r.onsuccess=()=>resolve(r.result||0);r.onerror=()=>reject(r.error)})}
function offCacheKey(action,payload={}){return `api:${action}:${JSON.stringify(payload,Object.keys(payload).sort())}`}
async function offCacheApi(action,payload,value){try{await offPut("kv",offCacheKey(action,payload),{ts:Date.now(),value})}catch(e){}}
async function offReadApi(action,payload){try{return (await offGet("kv",offCacheKey(action,payload)))?.value||null}catch{return null}}
async function offPendingCount(){const [r,p]=await Promise.all([offAll("reports"),offAll("photos")]);return r.filter(isOwnQueuedItem).length+p.filter(isOwnQueuedItem).length}
async function refreshNetworkBadge(){
  const e=$("network");if(!e)return;
  // count() doesn't read every photo Blob into memory on slow smartphones.
  const [r,p]=await Promise.all([offCount("reports"),offCount("photos")]);const n=r+p;
  e.classList.remove("syncing","offline","pending");
  if(!navigator.onLine){e.textContent=n?`HORS LIGNE · ${n} EN ATTENTE`:"HORS LIGNE";e.classList.add("offline")}
  else if(offlineSyncRunning){e.textContent=`TRANSFERT… · ${n} EN ATTENTE`;e.classList.add("syncing")}
  else if(n){e.textContent=`${n} À SYNCHRONISER`;e.classList.add("pending")}
  else e.textContent="SYNCHRONISÉ";
}
function offNetworkError(e){const s=String(e?.message||e||"").toLowerCase();return !navigator.onLine||abortIsNetworkError(e)||s.includes("failed to fetch")||s.includes("networkerror")||s.includes("load failed")||s.includes("timeout")||s.includes("timed out")||s.includes("abort")}
function offQueueReport(submit=false){
  // Capture form and job before the asynchronous queue: navigating to another
  // intervention must NEVER write yesterday's inputs to a different job.
  const v=currentOpenVisit(),jobId=state.current;
  if(!v||!jobId)return Promise.reject(new Error("Rapport introuvable."));
  const entry={jobId,visitId:v.id,technicianId:currentTechnicianId(),payload:visitPayload(),
    checks:[...document.querySelectorAll("[data-check]")].map(e=>({id:e.dataset.check,checked:e.checked})),
    submit,detail:state.currentDetail};
  const queued=localReportWrites.catch(()=>{}).then(()=>writeQueuedReport(entry));
  localReportWrites=queued;
  return queued;
}
async function writeQueuedReport(entry){
  const {jobId,visitId,technicianId,payload,checks,submit,detail}=entry;
  const old=await offGet("reports",jobId);
  const rec={...(old||{}),job_id:jobId,technician_id:technicianId,
    visit_id:visitId&&!String(visitId).startsWith("local-")?visitId:(old?.visit_id||null),
    payload:{...payload,visit_id:undefined},checks,submit:Boolean(submit||old?.submit),
    updated_at:Math.max(Date.now(),Number(old?.updated_at||0)+1),next_retry_at:0,sync_state:"local"};
  await offPut("reports",undefined,rec);
  const visit=detail?.visits?.find(v=>String(v.id)===String(visitId));
  if(visit)Object.assign(visit,payload);
  if(detail)await offCacheApi("job_detail",{job_id:jobId},detail);
  refreshNetworkBadge().catch(console.warn);
  if(navigator.onLine)scheduleBackgroundPhotoSync(1100);
  return rec;
}
async function offQueuePhoto(file,type,visitId){
  const id=`local-photo-${crypto.randomUUID?.()||Date.now()+"-"+Math.random().toString(36).slice(2)}`;
  const blob=file instanceof Blob?file:new Blob([file],{type:file.type||"image/jpeg"});
  const rec={id,job_id:state.current,technician_id:currentTechnicianId(),visit_id:visitId&&!String(visitId).startsWith("local-")?visitId:null,
    local_visit_id:visitId||null,photo_type:type,blob,mime_type:blob.type||file.type||"image/jpeg",original_filename:file.name||`photo-${Date.now()}.jpg`,created_at:Date.now(),attempts:0,next_retry_at:0,sync_state:"local"};
  // L'original est écrit en transaction IndexedDB AVANT tout transfert.
  await offPut("photos",undefined,rec);
  const localUrl=URL.createObjectURL(blob);
  if(state.currentDetail && String(state.current)===String(rec.job_id)){
    state.currentDetail.photos=state.currentDetail.photos||[];
    state.currentDetail.photos.push({id,visit_id:visitId,photo_type:type,signed_url:localUrl,_offline:true,_syncing:false});

    appendLocalPhotoThumb({id,visit_id:visitId,photo_type:type,signed_url:localUrl,_offline:true});

  refreshNetworkBadge().catch(console.warn);
  if(navigator.onLine)scheduleBackgroundPhotoSync(250);
  return rec;
}

function appendLocalPhotoThumb(p){
  const grid=document.getElementById(`photoGrid-${p.photo_type}-${p.visit_id}`);
  if(!grid || grid.querySelector(`[data-photo-id="${p.id}"]`))return;

  grid.insertBefore(el,add||null);
}
function scheduleBackgroundPhotoSync(delay=250){
  if(!navigator.onLine||!me)return;
  if(backgroundPhotoSyncTimer)clearTimeout(backgroundPhotoSyncTimer);
  backgroundPhotoSyncTimer=setTimeout(()=>{backgroundPhotoSyncTimer=null;syncOfflineQueue().catch(console.warn)},delay);
}
async function offHydrateLocalPhotos(detail){
  if(!detail?.job?.id)return detail;
  const jobId=String(detail.job.id);
  const pending=await offGet("reports",jobId);
  detail.visits=detail.visits||[];
  // Server reads may be older than a local auto-save: local draft ALWAYS wins
  // until its acknowledged transfer. Do not resurrect already submitted reports.
  if(pending&&isOwnQueuedItem(pending)&&!["report_received","validated","archived","cancelled"].includes(detail.job.status)){
    const tech=currentTechnicianId()||String(pending.technician_id||"");
    let active=detail.visits.find(v=>["draft","in_progress"].includes(v.status)&&
      (v.can_edit===true||String(v.technician_id)===String(pending.technician_id)));
    if(!active){
      active={id:pending.visit_id||`local-visit-${jobId}`,job_id:jobId,technician_id:pending.technician_id||tech,visit_date:new Date().toISOString().slice(0,10),status:"draft",can_edit:true};
      detail.visits.unshift(active);
    }
    Object.assign(active,pending.payload||{});
    active.can_edit=true;
    if(pending.checks?.length){
      detail.checks=detail.checks||[];
      for(const c of pending.checks){const existing=detail.checks.find(x=>x.id===c.id);if(existing)existing.checked=c.checked}
    }
  }
  const queued=(await offAll("photos")).filter(p=>String(p.job_id)===jobId&&isOwnQueuedItem(p));
  detail.photos=(detail.photos||[]).filter(p=>!String(p.id).startsWith("local-photo-"));
  const editable=detail.visits.find(v=>["draft","in_progress"].includes(v.status)&&String(v.technician_id)===String(pending?.technician_id||me?.id));
  for(const p of queued){
    const visitId=p.visit_id||pending?.visit_id||editable?.id||p.local_visit_id||`local-visit-${jobId}`;
    detail.photos.push({id:p.id,visit_id:visitId,photo_type:p.photo_type,signed_url:URL.createObjectURL(p.blob),_offline:true,_syncing:p.sync_state==="uploading",_error:p.sync_state==="error"});
  }
  return detail;
}
async function markFailed(store,rec,err){
  const current=await offGet(store,store==="photos"?rec.id:rec.job_id);
  if(!current)return;
  if(store==="photos"){const el=document.querySelector(`[data-photo-id="${CSS.escape(current.id)}"]`);if(el){el.classList.add("failed-photo");el.classList.remove("syncing-photo")}}
  const attempts=(current.attempts||0)+1;
  await offPut(store,undefined,{...current,attempts,next_retry_at:Date.now()+syncBackoff(attempts),sync_state:"error",last_error:String(err?.message||err).slice(0,300)});
}
async function callRemotePhotoExists(p,visitId){
  // A lost register_photo response MUST NOT cause a second row.
  const detail=await api("job_detail",{job_id:p.job_id},{skipOffline:true,timeoutMs:9000});
  return (detail.photos||[]).find(x=>x.storage_path===p.storage_path&&String(x.visit_id)===String(visitId));
}
async function syncOneQueuedPhoto(p,visitId){
  let current=await offGet("photos",p.id);
  if(!current||current.next_retry_at>Date.now()||!isOwnQueuedItem(current))return false;
  if(current.sync_state==="uploading")current={...current,sync_state:"local"}; // crash recovery
  if(!navigator.onLine||weakNetwork())return false;
  try{
    await offPut("photos",undefined,{...current,sync_state:"uploading"});
    const uploadingEl=document.querySelector(`[data-photo-id="${CSS.escape(current.id)}"]`);if(uploadingEl){uploadingEl.classList.add("syncing-photo");uploadingEl.classList.remove("failed-photo")}
    // Reuse one signed path, even after network timeouts, instead of creating duplicates.
    if(current.storage_path){
      const existing=await callRemotePhotoExists(current,visitId);
      if(existing){await completeQueuedPhoto(current,existing);return true}
    }
    let file=current.blob,mime=current.mime_type||"image/jpeg";
    if(!current.storage_path){
      file=await compressImage(new File([current.blob],current.original_filename,{type:mime}));
      mime=file.type||mime;
      // Save compressed bytes, so every retry uploads the same content.
      current={...current,blob:file,mime_type:mime};
      const sign=await api("photo_upload_url",{visit_id:visitId,photo_type:current.photo_type,mime_type:mime},{skipOffline:true,timeoutMs:10000});
      current.storage_path=sign.path;current.signed_token=sign.token;
      await offPut("photos",undefined,current);
    }
    const up=await storageClient.storage.from("technik-interventions").uploadToSignedUrl(current.storage_path,current.signed_token,current.blob,{contentType:current.mime_type});
    // A successful prior upload can return conflict on retry. Verify via registration.
    if(up.error&&!/already exists|duplicate|conflict|409/i.test(String(up.error.message||up.error))){
      if(/expired|jwt|unauthori|invalid token|403/i.test(String(up.error.message||up.error))){
        current.storage_path=null;current.signed_token=null; // obtain a new signing token on next attempt
      }
      throw up.error;
    }
    const result=await api("register_photo",{visit_id:visitId,photo_type:current.photo_type,storage_path:current.storage_path,original_filename:current.original_filename,mime_type:current.mime_type,file_size_bytes:current.blob.size},{skipOffline:true,timeoutMs:10000});
    await completeQueuedPhoto(current,{id:result.photo_id,visit_id:visitId,storage_path:current.storage_path});
    return true;
  }catch(err){
    await markFailed("photos",current,err);
    return false;
  }
}
async function completeQueuedPhoto(p,remote){
  await offDelete("photos",p.id);
  if(state.currentDetail?.job?.id===p.job_id){
    state.currentDetail.photos=(state.currentDetail.photos||[]).filter(x=>x.id!==p.id);
    // The remote image will be visible with its signed URL on the next detail refresh.
    const e=document.querySelector(`[data-photo-id="${CSS.escape(p.id)}"]`);
    if(e){e.classList.remove("pending-photo","syncing-photo");e.dataset.photoId=remote.id||p.id;
      let badge=e.querySelector(".photo-sync-label");if(badge)badge.textContent="Synchronisé"}
  }
}
async function syncOneQueuedReport(r){
  if(!isOwnQueuedItem(r)||r.next_retry_at>Date.now()||!navigator.onLine)return;
  const originalUpdated=r.updated_at;
  let visitId=r.visit_id;
  try{
    if(!visitId){
      const prep=await api("prepare_visit",{job_id:r.job_id},{skipOffline:true,timeoutMs:10000});
      visitId=prep.visit?.id||prep.visit_id;
      if(!visitId)throw new Error("Impossible de préparer le rapport.");
      const latest=await offGet("reports",r.job_id);if(!latest)return;
      await offPut("reports",undefined,{...latest,visit_id:visitId});
    }
    await api("save_visit",{...r.payload,visit_id:visitId},{skipOffline:true,timeoutMs:10000});
    if(r.checks?.length)await api("save_checks",{visit_id:visitId,checks:r.checks},{skipOffline:true,timeoutMs:10000});
    const pending=(await offAll("photos")).filter(p=>p.job_id===r.job_id);
    for(const p of pending)await syncOneQueuedPhoto(p,visitId);
    // Keep the report queued until ALL photos have a real remote visit ID and
    // are acknowledged; otherwise a newly-created offline visit can orphan them.
    if((await offAll("photos")).some(p=>p.job_id===r.job_id))return;
    if(r.submit){
      // Retry of an uncertain finish is preceded by a server-state check.
      const d=await api("job_detail",{job_id:r.job_id},{skipOffline:true,timeoutMs:10000});
      if(!["report_received","validated","archived"].includes(d.job?.status)&&
         !(d.visits||[]).some(v=>v.id===visitId&&["submitted","validated"].includes(v.status)))
        await api("finish_visit",{...r.payload,visit_id:visitId},{skipOffline:true,timeoutMs:10000});
    }
    const latest=await offGet("reports",r.job_id);
    if(latest?.updated_at===originalUpdated){await offDelete("reports",r.job_id)}
    else if(latest)await offPut("reports",undefined,{...latest,next_retry_at:0,sync_state:"local"});
    if(r.submit&&state.current===r.job_id){
      // Refresh only after the user is no longer editing the form.
      if(!document.activeElement?.matches("input,textarea,select"))jobDetail(r.job_id).catch(console.warn);
    }
  }catch(err){await markFailed("reports",r,err)}
}
async function syncOfflineQueue(){
  if(!navigator.onLine||offlineSyncRunning||!me)return;
  offlineSyncRunning=true;
  await refreshNetworkBadge().catch(()=>{});
  try{
    // Skip large photo uploads on a connection reported as 2G or data-saver.
    const reports=(await offAll("reports")).filter(isOwnQueuedItem);
    for(const r of reports)await syncOneQueuedReport(r);
    if(!weakNetwork()){
      const remaining=(await offAll("photos")).filter(isOwnQueuedItem);
      for(const p of remaining){
        const visitId=p.visit_id||(await offGet("reports",p.job_id))?.visit_id;
        if(visitId)await syncOneQueuedPhoto(p,visitId);
      }
    }
  }finally{
    offlineSyncRunning=false;
    await refreshNetworkBadge().catch(()=>{});
    if(await offPendingCount())queueRetry();
  }
}

function fmtMinutes(n){n=Number(n||0);if(!n)return "—";const h=Math.floor(n/60),m=n%60;return h?`${h} h ${String(m).padStart(2,"0")}`:`${m} min`}

async function api(action,payload={},options={}){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!navigator.onLine&&OFFLINE_READ_ACTIONS.has(action)&&!options.skipOffline){
    const cached=await offReadApi(action,payload);if(cached)return cached;
    throw new Error("Pas de réseau et ces données n'ont pas encore été synchronisées sur ce téléphone.");
  }
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),options.timeoutMs||(options.skipOffline?10000:9000));
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":CFG.key,"Authorization":"Bearer "+CFG.key},signal:controller.signal,body:JSON.stringify({action,device_name:deviceName(),device_token:token,...payload})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      if(j.error==="SESSION_INVALID"){
        // Keep pending local data; a network error must never clear the PIN session.
        localStorage.removeItem(TOKEN_KEY);me=null;showAuth();throw new Error("Session expirée.");
      }
      throw new Error(j.error||"Erreur de connexion.");
    }
    if(OFFLINE_READ_ACTIONS.has(action))await offCacheApi(action,payload,j);
    return j;
  }catch(e){
    if(!options.skipOffline&&OFFLINE_READ_ACTIONS.has(action)&&offNetworkError(e)){
      const cached=await offReadApi(action,payload);if(cached)return cached;
    }
    throw e;
  }finally{clearTimeout(timer)}
}

  if(open){bindCheckChanges();bindReportAutoSave();checkCanDeleteUnsent().catch(console.warn)}
}
function renderVisitAction(j,latest){
  if(j.status==="report_received")return `<div class="card"><div class="section-title">Rapport envoyé</div><div class="locked-report"><b>✓ Rapport transmis à WAPILOT</b><br>Le personnel technique peut encore le consulter, mais il n’est plus modifiable. Une correction éventuelle doit être faite depuis WAPILOT.</div></div>`;
  if(["validated","archived","cancelled"].includes(j.status))return `<div class="card"><div class="empty"><div class="ico">✓</div>Cette intervention est clôturée dans WAPILOT.</div></div>`;
  return `<div class="card"><div class="section-title">Rapport terrain</div><p class="sub">Ajoutez les photos et complétez simplement le rapport d’intervention. Vous pouvez l’enregistrer et y revenir autant de fois que nécessaire avant l’envoi.</p><button class="primary" style="width:100%;margin-top:10px" onclick="prepareVisit()">Remplir le rapport</button></div>`;
}
function visitTimeValue(iso){
  if(!iso)return "";
  try{
    const d=new Date(iso);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }catch{return ""}
}
function visitIsoFromTime(dateValue,timeValue){
  if(!dateValue||!timeValue)return null;
  const d=new Date(`${dateValue}T${timeValue}:00`);
  return Number.isNaN(d.getTime())?null:d.toISOString();
}
function calcVisitMinutes(arrival,departure){
  if(!arrival||!departure)return 0;
  const [ah,am]=arrival.split(":").map(Number),[dh,dm]=departure.split(":").map(Number);
  const a=ah*60+am,d=dh*60+dm;
  return d>a?d-a:0;
}
function formatAutoDuration(mins){
  mins=Number(mins||0);if(!mins)return "—";
  const h=Math.floor(mins/60),m=mins%60;
  return h?`${h} h ${String(m).padStart(2,"0")}`:`${m} min`;
}
function refreshAutoDuration(){
  const a=$("arrivalTime")?.value||"",d=$("departureTime")?.value||"";
  const mins=calcVisitMinutes(a,d),el=$("autoDuration");
  if(el)el.textContent=formatAutoDuration(mins);
}
async function openAddTechnicianModal(){
  if(!navigator.onLine){
    alert("L'ajout d'un technicien nécessite une connexion. Le rapport et les photos restent utilisables hors ligne.");
    return;
  }
  try{
    const refs=await ensureRefs();
    const currentIds=new Set((state.currentDetail?.job?.assignees||[]).map(a=>String(a.technician_id)));
    const available=(refs.technicians||[]).filter(u=>!currentIds.has(String(u.id)));

    if(!available.length){
      alert("Tous les techniciens actifs sont déjà affectés à cette intervention.");
      return;
    }

    openModal(`<h3>Ajouter un technicien</h3>
      <div class="sub" style="margin-bottom:10px">Le collègue ajouté verra immédiatement l'intervention dans sa PWA. Il n'y aura toujours qu'un seul rapport commun.</div>
      <div class="team-picker">
        ${available.map(u=>`<label class="team-choice"><input type="checkbox" class="add-team-tech" value="${esc(u.id)}"><span><b>${esc(u.display_name)}</b>${u.trade?`<small>${esc(u.trade)}</small>`:""}</span></label>`).join("")}
      </div>
      <div class="footer-actions" style="margin-top:14px">
        <button class="light" onclick="closeModal()">Annuler</button>
        <button class="primary" onclick="confirmAddTechnicians()">Ajouter</button>
      </div>`);
  }catch(e){alert(e.message)}
}
async function confirmAddTechnicians(){
  const ids=[...document.querySelectorAll(".add-team-tech:checked")].map(x=>x.value);
  if(!ids.length)return alert("Sélectionnez au moins un technicien.");
  const btn=document.querySelector("#modalRoot .primary");

    const detail=await api("add_job_assignees",{job_id:state.current,technician_ids:ids});

}

function renderActiveVisit(v,d){
  const photos=d.photos||[],before=photos.filter(p=>p.visit_id===v.id&&p.photo_type==="before"),after=photos.filter(p=>p.visit_id===v.id&&p.photo_type==="after");
  const checks=(d.checks||[]).filter(c=>c.visit_id===v.id);
  const arrival=visitTimeValue(v.started_at),departure=visitTimeValue(v.ended_at);
  const currentMinutes=Number(v.duration_minutes||0);
  return `<div class="card">
    <div class="section-title"><span>Rapport d’intervention</span><span class="chip">BROUILLON</span></div>
    <div class="draft-note">● Brouillon enregistré : vous pouvez quitter cette page et reprendre le rapport plus tard.</div>
    <div class="report-intro">Aucun chronomètre n’est utilisé. Indiquez l’heure d’arrivée et l’heure de départ : la durée est calculée automatiquement.</div>
    <div class="section-title">Photos avant <span class="sub">${before.length} photo(s)</span></div>
    ${photoGrid(before,"before",v.id)}
    <div class="field" style="margin-top:14px"><label>TRAVAIL EFFECTUÉ *</label><textarea id="workDone" placeholder="Décrivez précisément ce qui a été réalisé…">${esc(v.work_done||"")}</textarea></div>
    <div class="field"><label>MATÉRIEL UTILISÉ</label><textarea id="materials" placeholder="Ex. 2 ampoules LED, silicone, peinture…">${esc(v.materials_used||"")}</textarea></div>
    ${checks.length?`<div class="section-title">Checklist nettoyage</div><div id="checks">${checks.map(c=>`<label class="check"><input type="checkbox" data-check="${c.id}" ${c.checked?"checked":""}><span>${esc(c.label_snapshot)}</span></label>`).join("")}</div>`:""}
    <div class="section-title" style="margin-top:15px">Photos après <span class="sub">${after.length} photo(s)</span></div>
    ${photoGrid(after,"after",v.id)}
    <div class="field" style="margin-top:14px"><label>HORAIRES DE L'INTERVENTION *</label>
      <div class="hours-grid">
        <div class="field" style="margin:0"><label>HEURE D'ARRIVÉE</label><input id="arrivalTime" type="time" value="${arrival}" oninput="refreshAutoDuration()"></div>
        <div class="field" style="margin:0"><label>HEURE DE DÉPART</label><input id="departureTime" type="time" value="${departure}" oninput="refreshAutoDuration()"></div>
      </div>
      <div class="duration-auto"><span>Temps passé calculé automatiquement</span><b id="autoDuration">${formatAutoDuration(currentMinutes||calcVisitMinutes(arrival,departure))}</b></div>
    </div>
    <div class="field"><label>REMARQUES</label><textarea id="remarks" placeholder="Difficulté rencontrée, suivi nécessaire…">${esc(v.remarks||"")}</textarea></div>
    <div class="footer-actions"><button class="light" onclick="saveVisit()">Enregistrer</button><button class="primary" onclick="finishVisit()">Envoyer rapport</button></div>
    <div id="deleteDraftAction" class="delete-draft-action"><button class="delete-draft-btn" onclick="deleteUnsentIntervention()">Supprimer une intervention créée par erreur</button><small>Disponible uniquement pour une intervention créée depuis DL TECHNIK, non envoyée et dont la suppression est autorisée par WAPILOT.</small></div>
  </div>`;
}
function photoGrid(arr,type,visitId){
  return `<div class="photos" id="photoGrid-${type}-${visitId}">${arr.map(p=>`<div class="photo ${p._offline?"pending-photo":""} ${p._syncing?"syncing-photo":""} ${p._error?"failed-photo":""}" data-photo-id="${esc(p.id)}">${p.signed_url?`<img src="${esc(p.signed_url)}" alt="Photo">`:""}<button onclick="event.stopPropagation();deletePhoto('${p.id}')">×</button></div>`).join("")}<button class="add-photo" onclick="pickPhotos('${type}','${visitId}')"><b>＋</b><span>Ajouter</span></button></div><div class="bg-upload-note">Les photos sont sécurisées sur le téléphone puis envoyées en arrière-plan.</div>`;
}
function renderVisitHistory(v){
  const mins=v.manual_duration_minutes??v.duration_minutes;
  return `<div class="visit"><h4>${fmtDate(v.visit_date)} · ${v.status==="submitted"?"Rapport envoyé":v.status==="validated"?"Validé":statusLabel(v.status)}</h4><p>⏱ ${fmtMinutes(mins)}</p>${v.work_done?`<p><b>Travaux :</b> ${esc(v.work_done)}</p>`:""}${v.remarks?`<p><b>Remarques :</b> ${esc(v.remarks)}</p>`:""}</div>`;
}
async function prepareVisit(){
  const d=state.currentDetail;if(!d)return;
  if(currentOpenVisit()){renderDetail();return}
  if(!d.visits)d.visits=[];
  const local={id:`local-visit-${state.current}`,job_id:state.current,technician_id:currentTechnicianId(),visit_date:new Date().toISOString().slice(0,10),status:"draft",can_edit:true,work_done:"",materials_used:"",remarks:"",started_at:null,ended_at:null,duration_minutes:0};
  d.visits.unshift(local);
  try{await offCacheApi("job_detail",{job_id:state.current},d);renderDetail();toast("Rapport prêt · enregistré localement")}
  catch(e){alert("Brouillon local impossible : "+e.message)}
}

function visitPayload(){
  const v=currentOpenVisit();
  const date=v?.visit_date||new Date().toISOString().slice(0,10);
  const arrival=$("arrivalTime")?.value||"";
  const departure=$("departureTime")?.value||"";
  return {
    visit_id:v?.id,
    work_done:$("workDone")?.value||"",
    materials_used:$("materials")?.value||"",
    remarks:$("remarks")?.value||"",
    started_at:visitIsoFromTime(date,arrival),
    ended_at:visitIsoFromTime(date,departure)
  }
}
async function saveChecks(){await offQueueReport(false)}
function bindCheckChanges(){document.querySelectorAll("[data-check]").forEach(e=>e.addEventListener("change",()=>offQueueReport(false).catch(console.warn)))}
function bindReportAutoSave(){
  for(const el of document.querySelectorAll("#workDone,#materials,#remarks,#arrivalTime,#departureTime")){
    el.addEventListener("input",()=>{
      if(reportSaveTimer)clearTimeout(reportSaveTimer);
      reportSaveTimer=setTimeout(()=>{reportSaveTimer=null;offQueueReport(false).catch(console.warn)},400);
    });
    el.addEventListener("change",()=>offQueueReport(false).catch(console.warn));
  }
}
async function saveVisit(silent=false){
  if(reportSaveTimer){clearTimeout(reportSaveTimer);reportSaveTimer=null}
  try{await offQueueReport(false);if(!silent)toast("Brouillon enregistré sur le téléphone");return true}
  catch(e){if(!silent)alert("Enregistrement local impossible : "+e.message);return false}
}
async function finishVisit(){
  const p=visitPayload();
  if(!String(p.work_done||"").trim())return alert("Indiquez le travail effectué avant d'envoyer le rapport.");
  if(!p.started_at)return alert("Indiquez l'heure d'arrivée avant d'envoyer le rapport.");
  if(!p.ended_at)return alert("Indiquez l'heure de départ avant d'envoyer le rapport.");
  if(new Date(p.ended_at).getTime()<=new Date(p.started_at).getTime())return alert("L'heure de départ doit être postérieure à l'heure d'arrivée.");
  if(!confirm("Placer ce rapport dans la file d'envoi vers WAPILOT ? Les photos seront envoyées avant le rapport."))return;
  if(reportSaveTimer){clearTimeout(reportSaveTimer);reportSaveTimer=null}
  try{await offQueueReport(true);toast("Rapport conservé localement · envoi en attente");scheduleBackgroundPhotoSync(150)}
  catch(e){alert("Enregistrement impossible : "+e.message)}
}


/* ---------------- PHOTOS ---------------- */
let cameraStream=null;
let cameraShots=[];
let cameraPhotoType=null;
let cameraVisitId=null;
let cameraCapabilities=null;
let cameraCameras=[];
let cameraDeviceId=null;
let cameraZoom=1;
let cameraCaptureBusy=false;
let cameraTouchDistance=null;

async function pickPhotos(type,visitId){
  // Locally preserve report fields first; never wait for the server before opening camera.
  if(!await saveVisit(true))return;
  cameraPhotoType=type;cameraVisitId=visitId;cameraShots=[];
  if(navigator.mediaDevices?.getUserMedia){
    try{await startCamera();renderCamera();return}
    catch(e){console.warn("Caméra intégrée indisponible",e);stopCamera()}
  }
  pickGallery(type,visitId);
}
async function startCamera(deviceId=null){
  stopCamera();
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{...(deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:"environment"}}),width:{ideal:1920},height:{ideal:1080}},audio:false});
  cameraDeviceId=cameraStream.getVideoTracks()[0]?.getSettings?.().deviceId||deviceId;
  cameraCapabilities=cameraStream.getVideoTracks()[0]?.getCapabilities?.()||{};
  const zoom=cameraCapabilities.zoom;
  cameraZoom=zoom&&Number.isFinite(zoom.min)&&Number.isFinite(zoom.max)?Math.max(zoom.min,Math.min(zoom.max,1)):1;
  try{
    cameraCameras=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"&&d.deviceId);
  }catch{cameraCameras=[]}
}
function renderCamera(){
  $("modalRoot").innerHTML=`<div class="camera-modal">
    <div class="camera-top"><b>${cameraPhotoType==="before"?"Photos avant":"Photos après"}</b><button class="camera-close" onclick="closeCamera()" aria-label="Fermer">×</button></div>
    <div class="camera-stage" id="cameraStage"><video id="cameraVideo" autoplay playsinline muted></video><div class="camera-guide"></div></div>
    <div class="camera-bottom">
      <div class="camera-controls" id="cameraControls"></div>
      <div id="cameraCounter" class="camera-counter">Photos sécurisées sur le téléphone dès la prise</div>
      <div class="camera-actions">
        <button class="camera-gallery" onclick="pickGalleryFromCamera()">Galerie</button>
        <button class="shutter" onclick="captureShot()" aria-label="Prendre une photo"></button>
        <button id="cameraDone" class="camera-done" onclick="uploadCameraShots()">Terminer</button>
      </div>
      <div id="cameraPreviews" class="camera-previews"></div>
    </div>
  </div>`;
  const video=$("cameraVideo");video.srcObject=cameraStream;video.play().catch(()=>{});
  const stage=$("cameraStage");
  stage.addEventListener("touchstart",e=>{if(e.touches.length===2)cameraTouchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
  stage.addEventListener("touchmove",e=>{if(e.touches.length!==2||!cameraTouchDistance||!cameraCapabilities?.zoom)return;e.preventDefault();const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(Math.abs(dist-cameraTouchDistance)>18){changeCameraZoom(cameraZoom*(dist/cameraTouchDistance));cameraTouchDistance=dist}},{passive:false});
  stage.addEventListener("touchend",()=>{cameraTouchDistance=null},{passive:true});
  renderCameraControls();refreshCameraShots();
}
function renderCameraControls(){
  const el=$("cameraControls");if(!el)return;
  const zoom=cameraCapabilities?.zoom;
  const hasZoom=zoom&&Number.isFinite(zoom.min)&&Number.isFinite(zoom.max)&&zoom.max>zoom.min;
  const min=hasZoom?Number(zoom.min):1,max=hasZoom?Number(zoom.max):1;
  // 0.5× is not shown merely because a phone has several physical sensors.
  const wide=hasZoom&&min<=0.5;
  const quick=[...(wide?[0.5]:[]),...(hasZoom&&min<=1&&max>=1?[1]:[]),...(hasZoom&&max>=2?[2]:[])];
  const cams=cameraCameras.filter(c=>c.deviceId);
  el.innerHTML=`${hasZoom?`<div class="camera-zoombar">${quick.map(v=>`<button class="camera-zoom-choice ${Math.abs(cameraZoom-v)<0.08?"on":""}" onclick="changeCameraZoom(${v})">${v===0.5?"0,5":v}×</button>`).join("")}<span class="camera-zoom-current">${cameraZoom.toFixed(1).replace(".",",")}×</span><input aria-label="Niveau de zoom" class="camera-zoom-range" type="range" min="${min}" max="${max}" value="${cameraZoom}" step="${Math.max(0.05,(max-min)/80)}" oninput="changeCameraZoom(Number(this.value))"></div>`:""}
    ${cams.length>1?`<select class="camera-device" aria-label="Choisir l’objectif" onchange="switchCamera(this.value)">${cams.map((c,i)=>`<option value="${esc(c.deviceId)}" ${c.deviceId===cameraDeviceId?"selected":""}>${esc(c.label||`Caméra ${i+1}`)}</option>`).join("")}</select>`:""}`;
}
async function changeCameraZoom(value){
  const track=cameraStream?.getVideoTracks?.()[0],zoom=cameraCapabilities?.zoom;
  if(!track||!zoom)return;
  const target=Math.max(zoom.min,Math.min(zoom.max,value));
  try{await track.applyConstraints({advanced:[{zoom:target}]});cameraZoom=track.getSettings?.().zoom??target;renderCameraControls()}
  catch(e){console.warn("Zoom non autorisé",e)}
}
async function switchCamera(id){
  if(!cameraCameras.some(c=>c.deviceId===id))return;
  const previous=cameraDeviceId;
  try{await startCamera(id);renderCamera()}
  catch(e){
    alert("Cette caméra n'est pas accessible : "+e.message);
    try{await startCamera(previous);renderCamera()}catch(err){closeCamera();console.warn(err)}
  }
}
async function captureShot(){
  const video=$("cameraVideo");if(!video||!video.videoWidth||cameraCaptureBusy)return;
  cameraCaptureBusy=true;
  try{
    const max=1800,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
    canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
    const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",.84));
    if(!blob)throw new Error("Impossible de sauvegarder cette photo.");
    const name=`photo-${Date.now()}-${cameraShots.length+1}.jpg`;
    const record=await uploadPhoto(new File([blob],name,{type:"image/jpeg"}),cameraPhotoType,cameraVisitId);
    cameraShots.push({id:record.id,url:URL.createObjectURL(blob),name});
    refreshCameraShots();
  }catch(e){alert("La photo n'a pas pu être conservée sur le téléphone : "+e.message)}
  finally{cameraCaptureBusy=false}
}
function refreshCameraShots(){
  const c=$("cameraCounter"),p=$("cameraPreviews");
  if(c)c.textContent=`${cameraShots.length} photo${cameraShots.length>1?"s":""} enregistrée${cameraShots.length>1?"s":""} localement`;
  if(p)p.innerHTML=cameraShots.map((s,i)=>`<div class="camera-preview"><img src="${s.url}"><button onclick="removeCameraShot(${i})">×</button></div>`).join("");
}
async function removeCameraShot(i){
  const s=cameraShots[i];if(!s)return;
  const record=await offGet("photos",s.id);
  if(!record||record.sync_state==="uploading")return alert("Cette photo est déjà en cours de transfert. Supprimez-la depuis le rapport une fois synchronisée.");
  if(!confirm("Supprimer cette photo enregistrée localement ?"))return;
  await deletePhoto(s.id,true);
  URL.revokeObjectURL(s.url);cameraShots.splice(i,1);refreshCameraShots();
}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function closeCamera(){stopCamera();cameraShots.forEach(s=>URL.revokeObjectURL(s.url));cameraShots=[];$("modalRoot").innerHTML=""}
async function uploadCameraShots(){closeCamera();toast("Photos enregistrées · synchronisation en arrière-plan");scheduleBackgroundPhotoSync(150)}
function pickGalleryFromCamera(){closeCamera();pickGallery(cameraPhotoType,cameraVisitId)}
function pickGallery(type,visitId){
  const input=document.createElement("input");input.type="file";input.accept="image/*";input.multiple=true;
  input.onchange=async()=>{
    const files=[...(input.files||[])];if(!files.length)return;
    let saved=0;
    for(const file of files){try{await uploadPhoto(file,type,visitId);saved++}catch(e){alert(`Enregistrement local impossible (${file.name}): ${e.message}`)}}
    toast(`${saved} photo${saved>1?"s":""} sécurisée${saved>1?"s":""} localement`);
  };
  input.click();
}
async function compressImage(file){
  if(!file.type.startsWith("image/"))return file;
  try{
    const bitmap=await createImageBitmap(file),max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
    const w=Math.round(bitmap.width*scale),h=Math.round(bitmap.height*scale),canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(bitmap,0,0,w,h);
    bitmap.close?.();
    const blob=await new Promise(res=>canvas.toBlob(res,"image/jpeg",.82));
    return blob||file;
  }catch{return file}
}
async function uploadPhoto(file,type,visitId){return {queued:true,id:(await offQueuePhoto(file,type,visitId)).id}}
async function deletePhoto(id,alreadyConfirmed=false){
  if(!alreadyConfirmed&&!confirm("Supprimer cette photo ?"))return;
  if(String(id).startsWith("local-photo-")){
    const rec=await offGet("photos",id);
    if(!rec)return alert("La photo vient d'être synchronisée. Actualisez le rapport avant de la supprimer.");
    if(rec.sync_state==="uploading")return alert("Transfert en cours. Réessayez après la synchronisation.");
    await offDelete("photos",id);
    state.currentDetail.photos=(state.currentDetail.photos||[]).filter(p=>String(p.id)!==String(id));
    toast("Photo locale supprimée");renderDetail();await refreshNetworkBadge();return;
  }
  try{await api("delete_photo",{photo_id:id});toast("Photo supprimée");await jobDetail(state.current)}catch(e){alert(e.message)}
}
async function checkCanDeleteUnsent(){
  const el=$("deleteDraftAction");if(!el||!state.current||!navigator.onLine)return;
  try{
    const r=await api("can_delete_unsubmitted_job",{job_id:state.current},{timeoutMs:6000});
    if(state.current===r.job_id&&r.allowed)el.classList.add("allowed");
  }catch(e){/* Unsupported deployed API => do not offer deletion. */}
}
async function deleteUnsentIntervention(){
  const jobId=state.current;if(!jobId)return;
  if(offlineSyncRunning)return alert("Une synchronisation est en cours. Réessayez une fois son état confirmé.");
  if(!navigator.onLine)return alert("La suppression exige une confirmation du serveur. Reconnectez-vous avant de supprimer.");
  const report=await offGet("reports",jobId);
  if(report?.submit)return alert("Le rapport est en cours d'envoi ou son état est incertain. Suppression interdite.");
  const photos=(await offAll("photos")).filter(p=>p.job_id===jobId);
  if(photos.some(p=>p.sync_state==="uploading"))return alert("Des photos sont en cours de transfert. Suppression impossible pour le moment.");
  if(!confirm("Supprimer cette intervention créée depuis DL TECHNIK ? Seule une intervention non envoyée peut être annulée. Cette opération est irréversible depuis le téléphone."))return;
  try{
    // Permission + state must be rechecked atomically on the server.
    const cancelled=await api("cancel_unsubmitted_job",{job_id:jobId},{skipOffline:true,timeoutMs:12000});
    if(cancelled.ok!==true||cancelled.job_id!==jobId)throw new Error("Confirmation de suppression non reçue du serveur.");
    // Only after the server confirms do we discard the local draft and media.
    await offDelete("reports",jobId);
    for(const p of photos)await offDelete("photos",p.id);
    await offDelete("kv",offCacheKey("job_detail",{job_id:jobId}));
    toast("Intervention annulée");await go("jobs");
  }catch(e){alert("Suppression non effectuée : "+e.message+". Les données locales ont été conservées.")}
}

function closeModal(){stopCamera?.();$("modalRoot").innerHTML=""}

boot();
